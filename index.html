<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bukuku – Pembukuan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#16262B; --muted:#5A6C72;
  --line:#D6DFDD; --line-soft:#E7EDEB;
  --side:#14323D; --side-ink:#CFE0E5; --side-active:#21505F; --side-muted:#8BA5AD;
  --accent:#1B5E73; --accent-ink:#FFFFFF; --accent-soft:#E1EEF2;
  --pos:#1B7A52; --neg:#B23A2E; --amber:#B9772B;
  --warn:#7A4E00; --warn-bg:#FBF1DA; --ok-bg:#DDF0E6; --bad-bg:#F8E1DD;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E181C; --surface:#15252B; --ink:#E4EEF0; --muted:#93A8AE;
    --line:#2A3D44; --line-soft:#21323A;
    --side:#0A1317; --side-ink:#C4D6DA; --side-active:#1A3540; --side-muted:#6F8A92;
    --accent:#5FB4CC; --accent-ink:#06222B; --accent-soft:#193642;
    --pos:#54C48F; --neg:#F08A7C; --amber:#E0A35A;
    --warn:#E3B866; --warn-bg:#2D2512; --ok-bg:#15332A; --bad-bg:#3A1F1B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px 16px;overflow:auto}
.brand{padding:0 10px 18px}
.brand b{display:block;font-size:19px;font-weight:600;letter-spacing:.2px;color:#fff}
.brand span{display:block;font-size:12.5px;color:var(--side-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--side-active);border-left-color:#8CD3E6;color:#fff;font-weight:500}
.nav small{font-size:11.5px;color:var(--side-muted)}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:10px 4px}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--side-muted)}

.main-wrap{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:600;margin:0;flex:1}
.menu-btn{display:none}
.period{display:flex;align-items:center;gap:4px}
.period button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer;font-size:18px;line-height:1}
.period input{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:0 8px}
main{padding:22px 24px 60px;max-width:1180px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.panel>h2,.panel-h{font-size:15px;font-weight:600;margin:0;padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:16px;border-right:1px solid var(--line-soft)}
.stat:last-child{border-right:0}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat b{display:block;font-size:21px;font-weight:600;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.lnk{background:none;border:0;padding:2px 6px;color:var(--accent);cursor:pointer;font-size:13px;border-radius:4px}
.lnk:hover{background:var(--accent-soft)}
.lnk.danger{color:var(--neg)}
input[type=text],input[type=date],input[type=search],input[type=month],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 10px;width:100%;min-height:36px}
.bar input[type=search],.bar select{width:auto;min-width:200px}

.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .act{text-align:right;white-space:nowrap}
.tbl .kode{font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap;width:1%}
.tbl tr.lv1 td{background:var(--accent-soft);font-weight:600}
.tbl tr.lv2 td{font-weight:500;background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.tbl tr.lv2 .nm{padding-left:24px}
.tbl tr.lv3 .nm{padding-left:48px;position:relative}
.tbl tr.lv3 .nm::before{content:"";position:absolute;left:36px;top:0;bottom:0;border-left:1px solid var(--line)}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--line)}
.tbl tr.sub td{color:var(--muted)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line)}
.dim{color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500;vertical-align:1px;margin-left:6px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--pos)} .chip.bad{background:var(--bad-bg);color:var(--neg)} .chip.warn{background:var(--warn-bg);color:var(--warn)}

.jr{border-bottom:1px solid var(--line-soft);padding:12px 16px}
.jr:last-child{border-bottom:0}
.jr-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.jr-h .tgl{font-weight:600;font-variant-numeric:tabular-nums}
.jr-h .ket{flex:1;min-width:160px}
.jr .tbl td{padding:3px 12px;border:0}
.jr .tbl .cr{padding-left:40px}

.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.soon ul{margin:8px 0 0;padding-left:18px;color:var(--ink)} .soon li{margin:5px 0}
.note{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:6px;margin-bottom:16px}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line-soft)}
.checks li:last-child{border-bottom:0}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.chart{display:flex;gap:12px;height:160px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.chart .bars{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.chart .bars i{display:block;width:42%;max-width:24px;min-height:2px;border-radius:2px 2px 0 0}
.chart span{font-size:12px;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:10px;padding:22px;width:min(540px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(780px,96vw)}
dialog::backdrop{background:rgba(8,22,27,.55)}
dialog h2{margin:0 0 4px;font-size:17px}
dialog .hint{margin:0 0 14px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-weight:500;font-size:13px}
.field .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.err{color:var(--neg);min-height:20px;margin:4px 0 0}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.jr-tbl td{padding:4px 4px 4px 0;border:0}
.jr-tbl th{padding:4px 4px 4px 0}
.jr-tbl input.rp{text-align:right}
.jr-sum{display:flex;justify-content:flex-end;gap:22px;margin:10px 0;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;max-width:92vw;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}
.scrim{display:none}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:14px 16px;border-bottom:1px solid var(--line-soft);align-items:start}
.setrow:last-child{border-bottom:0}
.setrow b{display:block;font-weight:500}
.setrow small{display:block;color:var(--muted);margin-top:2px}
.jr-tbl input.di-q{text-align:right}
.jr-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pay-sum{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 12px;font-variant-numeric:tabular-nums}
.pay-sum span{color:var(--muted)} .pay-sum b{color:var(--ink);font-weight:600;margin-left:4px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:20;left:0;top:0;width:250px;transform:translateX(-100%);transition:transform .18s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(8,22,27,.5);z-index:15}
  .menu-btn{display:inline-block}
  .top{padding:10px 14px}
  main{padding:16px 14px 50px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line-soft)}
  .grid2{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .setrow{grid-template-columns:1fr;gap:8px}
  .stats.s3{grid-template-columns:1fr}
  .stats.s3 .stat{border-right:0;border-bottom:1px solid var(--line-soft)}
}
@media (max-width:520px){
  .top h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .period input{width:128px}
  .tbl th,.tbl td{padding-left:8px;padding-right:8px}
  .tbl tr.lv2 .nm{padding-left:12px}
  .tbl tr.lv3 .nm{padding-left:26px}
  .tbl tr.lv3 .nm::before{left:16px}
  .tbl .nm,.tbl td:nth-child(2){min-width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu utama">
    <div class="brand"><b>Bukuku</b><span id="brandCo"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Data tersimpan di browser ini. Ekspor berkala dari menu Data &amp; cadangan.</div>
  </aside>
  <div class="scrim" id="scrim" data-act="side-close"></div>
  <div class="main-wrap">
    <header class="top">
      <button class="btn sm menu-btn" data-act="menu" aria-label="Buka menu">Menu</button>
      <h1 id="title"></h1>
      <div class="period" id="period">
        <button type="button" data-act="per-prev" aria-label="Periode sebelumnya">‹</button>
        <input type="month" id="periode" aria-label="Periode">
        <button type="button" data-act="per-next" aria-label="Periode berikutnya">›</button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ============ Utilitas ============ */
const KEY='bukuku:v1';           // prefix unik supaya tidak bentrok dengan proyek lain di akun GitHub yang sama
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const num=n=>Math.round(Math.abs(n||0)).toLocaleString('id-ID');
const fmt=n=>{n=Math.round(n||0);return n===0?'–':(n<0?'-':'')+num(n)};
const rp=n=>'Rp '+((n||0)<0?'-':'')+num(n);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curP=()=>today().slice(0,7);
const perLabel=p=>BULAN[+p.slice(5)-1]+' '+p.slice(0,4);
const fmtDate=t=>t?(+t.slice(8))+' '+BLN[+t.slice(5,7)-1]+' '+t.slice(0,4):'';
const parseRp=v=>parseInt(String(v||'').replace(/\D/g,''),10)||0;
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shiftP=(p,d)=>{let y=+p.slice(0,4),m=+p.slice(5)+d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)};

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)}

/* ============ Data ============ */
let db;
const TIPE={aset:'Aset',kewajiban:'Kewajiban',ekuitas:'Ekuitas',pendapatan:'Pendapatan',beban:'Beban'};
const SUMBER={manual:'Manual',kas:'Kas',penjualan:'Penjualan',pembelian:'Pembelian',persediaan:'Persediaan'};

function emptyDb(){
  return {versi:2,perusahaan:'Nama Perusahaan',coa:[],jurnal:[],kas:[],penjualan:[],pembelian:[],barang:[],penyesuaian:[],setting:{penjualan:{},pembelian:{},persediaan:{}},terakhirEkspor:null};
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Gagal menyimpan ke browser. Ekspor data Anda segera.')}}
function migrate(d){
  const b=emptyDb();Object.keys(b).forEach(k=>{if(d[k]===undefined)d[k]=b[k]});
  ['penjualan','pembelian','persediaan'].forEach(k=>{if(!d.setting[k])d.setting[k]={}});
  autoSetting(d);return d;
}
function autoSetting(d){
  const map={'penjualan.piutang':'1-1-3','penjualan.pendapatan':'4-1-1','pembelian.utang':'2-1-1','persediaan.persediaan':'1-1-4','persediaan.hpp':'5-1-1','persediaan.selisih':'5-2-4'};
  Object.keys(map).forEach(p=>{const [a,b]=p.split('.');
    if(d.setting[a][b]===undefined){const x=d.coa.find(c=>c.level===3&&c.kode===map[p]);if(x)d.setting[a][b]=x.id}});
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.coa))return migrate(d)}}catch(e){}
  return null;
}
function seedCoa(){
  const A=(kode,nama,extra)=>Object.assign({id:uid(),kode,nama,level:kode.split('-').length,saldoAwal:0},extra||{});
  return [
    A('1','Aset',{tipe:'aset'}),
      A('1-1','Aset Lancar'),
        A('1-1-1','Kas',{kas:true}),
        A('1-1-2','Bank',{kas:true}),
        A('1-1-3','Piutang Usaha'),
        A('1-1-4','Persediaan Barang'),
      A('1-2','Aset Tetap'),
        A('1-2-1','Peralatan'),
    A('2','Kewajiban',{tipe:'kewajiban'}),
      A('2-1','Kewajiban Lancar'),
        A('2-1-1','Utang Usaha'),
    A('3','Ekuitas',{tipe:'ekuitas'}),
      A('3-1','Modal'),
        A('3-1-1','Modal Pemilik'),
    A('4','Pendapatan',{tipe:'pendapatan'}),
      A('4-1','Pendapatan Usaha'),
        A('4-1-1','Penjualan'),
    A('5','Beban',{tipe:'beban'}),
      A('5-1','Harga Pokok'),
        A('5-1-1','Harga Pokok Penjualan'),
      A('5-2','Beban Operasional'),
        A('5-2-1','Beban Gaji'),
        A('5-2-2','Beban Sewa'),
        A('5-2-3','Beban Listrik & Air'),
        A('5-2-4','Beban Selisih Persediaan')
  ];
}
function resetSample(){db=emptyDb();db.coa=seedCoa();autoSetting(db);persist()}

/* ============ Akun ============ */
const acc=id=>db.coa.find(a=>a.id===id);
const cmpKode=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);
  for(let i=0;i<Math.max(x.length,y.length);i++){const d=(i<x.length?x[i]:-1)-(i<y.length?y[i]:-1);if(d)return d}return 0};
const sortCoa=()=>db.coa.sort((a,b)=>cmpKode(a.kode,b.kode));
const headOf=a=>db.coa.find(x=>x.level===1&&x.kode===a.kode.split('-')[0]);
const tipeOf=a=>{const h=headOf(a);return h&&h.tipe?h.tipe:'aset'};
const normalOf=a=>(tipeOf(a)==='aset'||tipeOf(a)==='beban')?'D':'K';
const parentOf=a=>{const p=a.kode.split('-').slice(0,-1).join('-');return p?db.coa.find(x=>x.kode===p):null};
const leafs=()=>db.coa.filter(a=>a.level===3);
const hasKids=a=>db.coa.some(x=>x.kode.startsWith(a.kode+'-'));
const usedAcc=id=>db.jurnal.some(j=>j.baris.some(b=>b.akunId===id));
function nextKode(level,parent){
  if(level===1){return String(Math.max(0,...db.coa.filter(x=>x.level===1).map(x=>+x.kode))+1)}
  const kids=db.coa.filter(x=>x.level===level&&x.kode.startsWith(parent.kode+'-'));
  return parent.kode+'-'+(Math.max(0,...kids.map(x=>+x.kode.split('-').pop()))+1);
}
function accOptions(sel,filter){
  let out='<option value="">Pilih akun…</option>';
  db.coa.filter(a=>a.level===2).forEach(sh=>{
    const items=leafs().filter(a=>a.kode.startsWith(sh.kode+'-')&&(!filter||filter(a)));
    if(!items.length)return;
    out+=`<optgroup label="${esc(sh.kode+' '+sh.nama)}">`+items.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.kode+'  '+a.nama)}</option>`).join('')+'</optgroup>';
  });
  return out;
}

/* ============ Jurnal (pusat semua transaksi) ============ */
function nomorBaru(prefix,tanggal){
  const pre=prefix+'-'+tanggal.slice(0,7).replace('-','')+'-';let max=0;
  db.jurnal.forEach(j=>{if(j.nomor&&j.nomor.startsWith(pre)){const n=parseInt(j.nomor.slice(pre.length),10);if(n>max)max=n}});
  return pre+pad3(max+1);
}
const pad3=n=>String(n).padStart(3,'0');
function nomorCocok(nomor,prefix,tanggal){return nomor&&nomor.startsWith(prefix+'-'+tanggal.slice(0,7).replace('-','')+'-')}

function upsertJurnal(data){ // jurnal manual
  let j=data.id&&db.jurnal.find(x=>x.id===data.id);
  if(!j){j={id:uid(),sumber:'manual',ref:null,nomor:null};db.jurnal.push(j)}
  if(!nomorCocok(j.nomor,'JU',data.tanggal)){j.nomor=null;j.nomor=nomorBaru('JU',data.tanggal)}
  j.tanggal=data.tanggal;j.keterangan=data.keterangan;j.baris=data.baris;
  return j;
}
function upsertKas(k){

  Object.assign(rec,{tanggal:k.tanggal,jenis:k.jenis,akunKasId:k.akunKasId,akunLawanId:k.akunLawanId,nominal:k.nominal,keterangan:k.keterangan});
  const baris=k.jenis==='masuk'
    ?[{akunId:k.akunKasId,debit:k.nominal,kredit:0},{akunId:k.akunLawanId,debit:0,kredit:k.nominal}]
    :[{akunId:k.akunLawanId,debit:k.nominal,kredit:0},{akunId:k.akunKasId,debit:0,kredit:k.nominal}];

/* --- hitung stok (rata-rata bergerak) --- */
function stockCalc(){
  const ev=[];let seq=0;
  db.barang.forEach(b=>ev.push({seq:seq++,tgl:'0000-00-00',pr:0,b:b.id,kind:'awal',qty:b.stokAwal||0,val:b.nilaiAwal||0,ref:'',ket:'Stok awal'}));
  db.pembelian.forEach(d=>d.items.forEach(it=>ev.push({seq:seq++,tgl:d.tanggal,pr:1,b:it.barangId,kind:'beli',qty:it.qty,val:it.sub,ref:d.nomor,ket:'Pembelian'+(d.pihak?' – '+d.pihak:'')})));
  db.penyesuaian.forEach(a=>ev.push({seq:seq++,tgl:a.tanggal,pr:2,b:a.barangId,kind:'adj',qty:a.qty,ref:'Penyesuaian',ket:a.ket||'Penyesuaian stok',adjId:a.id}));
  db.penjualan.forEach(d=>d.items.forEach((it,i)=>ev.push({seq:seq++,tgl:d.tanggal,pr:3,b:it.barangId,kind:'jual',qty:it.qty,ref:d.nomor,ket:'Penjualan'+(d.pihak?' – '+d.pihak:''),key:d.id+':'+i})));
  ev.sort((x,y)=>x.tgl<y.tgl?-1:x.tgl>y.tgl?1:(x.pr-y.pr)||(x.seq-y.seq));
  const st={},kartu={},hpp={},adj={};
  db.barang.forEach(b=>{st[b.id]={q:0,v:0,avg:0};kartu[b.id]=[]});
  for(const e of ev){
    const s=st[e.b];if(!s)continue;
    let masuk=0,keluar=0,nilai=0;
    const inn=(q,v)=>{s.q=r3(s.q+q);s.v+=v;if(s.q>0)s.avg=s.v/s.q};
    if(e.kind==='awal'||e.kind==='beli'){inn(e.qty,e.val);masuk=e.qty;nilai=e.val}
    else if(e.kind==='adj'&&e.qty>0){const v=Math.round(s.avg*e.qty);inn(e.qty,v);masuk=e.qty;nilai=v;adj[e.adjId]=v}
    else{
      const q=Math.abs(e.qty);
      if(q>s.q+1e-9){const b=db.barang.find(x=>x.id===e.b);
        return {err:'Stok '+b.nama+' tidak cukup pada '+fmtDate(e.tgl)+': tersedia '+s.q+', dibutuhkan '+q+'.',kartu,hpp,adj,st}}
      const c=q>=s.q-1e-9?s.v:Math.round(s.v*q/s.q);
      s.q=r3(s.q-q);s.v-=c;if(s.q<=0){s.q=0;s.v=0}
      keluar=q;nilai=c;
      if(e.kind==='jual')hpp[e.key]=c;else adj[e.adjId]=-c;
    }
    if(e.kind==='awal'&&!masuk&&!nilai)continue;
    kartu[e.b].push({tgl:e.tgl,ref:e.ref,ket:e.ket,masuk,keluar,nilai,sq:s.q,sv:s.v});
  }
  return {err:null,kartu,hpp,adj,st};
}
function syncStock(){
  const r=stockCalc();if(r.err)return r.err;
  db.penjualan.forEach(d=>{d.items.forEach((it,i)=>{it.hpp=r.hpp[d.id+':'+i]||0});jurnalFaktur('penjualan',d)});
  db.penyesuaian.forEach(a=>{a.nilai=r.adj[a.id]||0;jurnalAdj(a)});
  return null;
}
// jalankan perubahan; kalau stok jadi minus atau ada kendala, semua dibatalkan
function tryChange(fn){
  const snap=JSON.stringify(db);
  try{fn();const err=syncStock();if(err){db=JSON.parse(snap);return err}}
  catch(e){db=JSON.parse(snap);return e.message}
  persist();return null;
}

/* --- faktur penjualan / pembelian --- */
const totalDoc=d=>d.items.reduce((t,i)=>t+i.sub,0);
const paidDoc=d=>d.bayar.reduce((t,p)=>t+p.nominal,0);
const statusDoc=d=>{const t=totalDoc(d),p=paidDoc(d);return p>=t?'lunas':p>0?'sebagian':'belum'};
function nomorDoc(list,prefix,tanggal){
  const pre=prefix+'-'+tanggal.slice(0,7).replace('-','')+'-';let max=0;
  list.forEach(d=>{if(d.nomor&&d.nomor.startsWith(pre)){const n=parseInt(d.nomor.slice(pre.length),10);if(n>max)max=n}});
  return pre+pad3(max+1);
}
function jurnalFaktur(t,d){
  const c=CFG[t],s=db.setting,miss=missing(MOD_KEYS[t]);
  if(miss.length)throw new Error('Atur '+miss.join(', ')+' di menu Setting dulu.');
  const total=totalDoc(d);let baris;
  if(t==='penjualan'){
    baris=[{akunId:s.penjualan.piutang,debit:total,kredit:0},{akunId:s.penjualan.pendapatan,debit:0,kredit:total}];
    const h=d.items.reduce((a,i)=>a+(i.hpp||0),0);
    if(h>0)baris.push({akunId:s.persediaan.hpp,debit:h,kredit:0},{akunId:s.persediaan.persediaan,debit:0,kredit:h});
  }else baris=[{akunId:s.persediaan.persediaan,debit:total,kredit:0},{akunId:s.pembelian.utang,debit:0,kredit:total}];
  setJurnal(d.jurnalId,{prefix:c.jp,tanggal:d.tanggal,keterangan:c.doc+' '+d.nomor+(d.pihak?' – '+d.pihak:'')+(d.ket?' ('+d.ket+')':''),sumber:t,ref:d.id,baris});
}
function jurnalBayar(t,d,p){
  const c=CFG[t],s=db.setting,lawan=t==='penjualan'?s.penjualan.piutang:s.pembelian.utang;
  if(!lawan||!acc(lawan))throw new Error('Atur akun '+(t==='penjualan'?'piutang':'utang')+' usaha di menu Setting dulu.');
  const baris=t==='penjualan'
    ?[{akunId:p.akunKasId,debit:p.nominal,kredit:0},{akunId:lawan,debit:0,kredit:p.nominal}]
    :[{akunId:lawan,debit:p.nominal,kredit:0},{akunId:p.akunKasId,debit:0,kredit:p.nominal}];
  setJurnal(p.jurnalId,{prefix:c.bp,tanggal:p.tanggal,keterangan:'Pelunasan '+d.nomor+(d.pihak?' – '+d.pihak:''),sumber:t,ref:d.id,payId:p.id,baris});
}
function saveDoc(t,o){
  const c=CFG[t],list=db[t];
  let d=o.id&&list.find(x=>x.id===o.id);
  const total=o.items.reduce((a,i)=>a+i.sub,0);
  if(d&&paidDoc(d)>total)throw new Error('Total faktur tidak boleh lebih kecil dari yang sudah dilunasi ('+rp(paidDoc(d))+').');
  if(!d){d={id:uid(),jurnalId:uid(),nomor:null,bayar:[]};list.push(d)}
  const pre=c.np+'-'+o.tanggal.slice(0,7).replace('-','')+'-';
  if(!d.nomor||!d.nomor.startsWith(pre)){d.nomor=null;d.nomor=nomorDoc(list,c.np,o.tanggal)}
  Object.assign(d,{tanggal:o.tanggal,pihak:o.pihak,ket:o.ket,items:o.items});
  if(t==='pembelian')jurnalFaktur(t,d);
  d.bayar.forEach(p=>jurnalBayar(t,d,p));
  return d;
}
function addBayar(t,did,p){
  const d=db[t].find(x=>x.id===did),sisa=totalDoc(d)-paidDoc(d);
  if(p.nominal>sisa)throw new Error('Pelunasan melebihi sisa ('+rp(sisa)+').');
  const rec={id:uid(),jurnalId:uid(),tanggal:p.tanggal,akunKasId:p.akunKasId,nominal:p.nominal,ket:p.ket||''};
  d.bayar.push(rec);jurnalBayar(t,d,rec);
}
function delBayar(t,did,pid){
  const d=db[t].find(x=>x.id===did),p=d.bayar.find(x=>x.id===pid);
  delJurnal(p.jurnalId);d.bayar=d.bayar.filter(x=>x.id!==pid);

/* ============ Perhitungan saldo ============ */
function saldoMap(periode){
  const start=periode+'-01',m={};
  leafs().forEach(a=>{m[a.id]={a,sa:a.saldoAwal||0,pd:0,pk:0,bd:0,bk:0}});
  db.jurnal.forEach(j=>j.baris.forEach(b=>{
    const r=m[b.akunId];if(!r)return;
    if(j.tanggal<start){r.bd+=b.debit;r.bk+=b.kredit}
    else if(j.tanggal.startsWith(periode)){r.pd+=b.debit;r.pk+=b.kredit}
  }));
  Object.values(m).forEach(r=>{
    r.s=normalOf(r.a)==='D'?1:-1;
    r.awal=r.sa+r.s*(r.bd-r.bk);
    r.akhir=r.awal+r.s*(r.pd-r.pk);
  });
  return m;
}
function ledger(accId,from,to){
  const a=acc(accId),s=normalOf(a)==='D'?1:-1;
  const ent=[];
  db.jurnal.forEach((j,i)=>j.baris.forEach(b=>{if(b.akunId===accId)ent.push({j,b,i})}));
  ent.sort((x,y)=>x.j.tanggal<y.j.tanggal?-1:x.j.tanggal>y.j.tanggal?1:x.i-y.i);
  let saldo=a.saldoAwal||0;const rows=[];let awal=null;
  ent.forEach(e=>{
    if(from&&e.j.tanggal<from){saldo+=s*(e.b.debit-e.b.kredit);return}
    if(awal===null)awal=saldo;
    if(to&&e.j.tanggal>to)return;
    saldo+=s*(e.b.debit-e.b.kredit);
    rows.push({tgl:e.j.tanggal,nomor:e.j.nomor,ket:e.j.keterangan,debit:e.b.debit,kredit:e.b.kredit,saldo});
  });
  if(awal===null)awal=saldo;
  return {awal,rows,akhir:rows.length?rows[rows.length-1].saldo:awal,normal:s===1?'D':'K'};
}

function sumberLabel(j){
  if(j.sumber==='kas'){const k=db.kas.find(x=>x.id===j.ref);return k?(k.jenis==='masuk'?'Kas masuk':'Kas keluar'):'Kas'}
  if(j.sumber==='penjualan')return j.payId?'Pelunasan penjualan':'Faktur penjualan';
  if(j.sumber==='pembelian')return j.payId?'Pelunasan pembelian':'Faktur pembelian';
  if(j.sumber==='persediaan')return 'Penyesuaian stok';
  return SUMBER[j.sumber]||j.sumber;
}

/* ============ Halaman: CoA ============ */
function pCoa(){
  const m=saldoMap(ui.periode),q=ui.coaQ.trim().toLowerCase();
  let list=db.coa.slice();
  if(q){const keep=new Set();
    list.filter(a=>a.kode.toLowerCase().includes(q)||a.nama.toLowerCase().includes(q)).forEach(h=>{const p=h.kode.split('-');for(let i=1;i<=p.length;i++)keep.add(p.slice(0,i).join('-'))});
    list=list.filter(a=>keep.has(a.kode));}
  const sum=(pre,k)=>Object.values(m).filter(r=>r.a.kode.startsWith(pre+'-')).reduce((t,r)=>t+r[k],0);
  const rows=list.map(a=>{
    let sa,ak,act='';
    if(a.level===3){sa=a.saldoAwal;ak=m[a.id].akhir}else{sa=sum(a.kode,'sa');ak=sum(a.kode,'akhir')}
    if(a.level===1)act+=btn('coa-add-sub',a.id,'+ Sub head');

    return `<tr class="lv${a.level}"><td class="kode">${esc(a.kode)}</td><td class="nm">${esc(a.nama)}${chip}</td><td class="num">${fmt(sa)}</td><td class="num">${fmt(ak)}</td><td class="act">${act}</td></tr>`}).join('');
  return `

    <tbody>${rows||`<tr><td colspan="5" class="empty">Tidak ada akun yang cocok.</td></tr>`}</tbody></table></div></section>

}

function pDoc(t){

  const arr=ui[tk]==='faktur'?inP:belum;
  return settingNote(missing(MOD_KEYS[t]))+`
  <section class="panel"><div class="stats s3">

    <div class="stat"><span>${c.sisa} belum lunas</span><b class="${sisaAll?'neg':''}">${rp(sisaAll)}</b><small>${belum.length} faktur, semua periode</small></div>

/* ============ Render & routing ============ */
function render(){

  $('#nav').innerHTML=ROUTES.map(x=>`<a href="#/${x.id}" data-act="go" data-id="${x.id}" class="${x.id===ui.route?'on':''}"${x.id===ui.route?' aria-current="page"':''}>${x.label}${x.soon?'<small>segera</small>':''}</a>`).join('')+
    `<div class="sep"></div><a href="#/data" data-act="go" data-id="data" class="${ui.route==='data'?'on':''}">Data &amp; cadangan</a>`;
  $('#title').textContent=r?r.label:'Data & cadangan';
  $('#period').hidden=ui.route==='data';
  $('#periode').value=ui.periode;
  $('#brandCo').textContent=db.perusahaan;
  document.title=(r?r.label:'Data & cadangan')+' – Bukuku';
  $('#main').innerHTML=PAGES[ui.route]();
}
function go(id){
  ui.route=PAGES[id]?id:'dashboard';
  try{history.replaceState(null,'','#/'+ui.route)}catch(e){}
  closeSide();render();window.scrollTo(0,0);
}
function route(){go(location.hash.replace(/^#\//,''))}
function closeSide(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')}
function commit(){persist();render()}

/* ============ Dialog ============ */
const dlg=$('#dlg');
function openDlg(html,wide){dlg.className=wide?'wide':'';dlg.innerHTML=html;if(!dlg.open)dlg.showModal();const f=dlg.querySelector('input:not([type=hidden]),select');if(f&&!f.disabled)f.focus()}
function closeDlg(){if(dlg.open)dlg.close()}
const setErr=t=>{const e=dlg.querySelector('.err');if(e)e.textContent=t};
const val=id=>dlg.querySelector('#'+id).value;

/* --- CoA --- */
function dlgCoa(o){
  const edit=!!o.id,a=edit?acc(o.id):null;
  const level=edit?a.level:o.level;
  const parent=edit?parentOf(a):(o.parentId?acc(o.parentId):null);
  const kids=edit&&hasKids(a);
  const name=['','head','sub head','akun'][level];
  openDlg(`<form novalidate><h2>${edit?'Ubah':'Tambah'} ${name}</h2>
    <p class="hint">${parent?'Di bawah '+esc(parent.kode+' '+parent.nama):'Kelompok paling atas'}</p>
    <div class="row2"><div class="field"><label for="f-kode">Kode</label><input type="text" id="f-kode" value="${esc(edit?a.kode:nextKode(level,parent))}" ${kids?'disabled':''} inputmode="numeric" autocomplete="off">
      ${kids?'<div class="sub">Kode dikunci karena masih punya akun di bawahnya.</div>':''}</div>
    <div class="field"><label for="f-nama">Nama</label><input type="text" id="f-nama" value="${esc(edit?a.nama:'')}" autocomplete="off"></div></div>
    ${level===1?`<div class="field"><label for="f-tipe">Jenis</label><select id="f-tipe">${Object.entries(TIPE).map(([k,v])=>`<option value="${k}"${edit&&a.tipe===k?' selected':''}>${v}</option>`).join('')}</select>
      <div class="sub">Menentukan sisi normal (debit atau kredit) dan posisi di laporan.</div></div>`:''}
    ${level===3?`<div class="field"><label for="f-sa">Saldo awal (Rp)</label><input type="text" id="f-sa" class="rp" inputmode="numeric" value="${edit&&a.saldoAwal?num(a.saldoAwal):''}" placeholder="0"></div>
      <div class="field check"><input type="checkbox" id="f-kas"${edit&&a.kas?' checked':''}><label for="f-kas" style="margin:0">Akun kas atau bank (muncul di Jurnal kas)</label></div>`:''}
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Batal</button><button type="submit" class="btn primary">Simpan</button></div></form>`);
  dlg.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    const kode=val('f-kode').trim(),nama=val('f-nama').trim();
    const re=level===1?/^\d+$/:new RegExp('^'+escRe(parent.kode)+'-\\d+$');
    if(!nama)return setErr('Nama akun wajib diisi.');
    if(!re.test(kode))return setErr(level===1?'Kode head berupa angka, contoh 1.':'Kode harus diawali '+parent.kode+'-, contoh '+nextKode(level,parent)+'.');
    if(db.coa.some(x=>x.kode===kode&&(!edit||x.id!==a.id)))return setErr('Kode '+kode+' sudah dipakai.');
    const rec=edit?a:{id:uid(),level,saldoAwal:0};
    rec.kode=kode;rec.nama=nama;
    if(level===1)rec.tipe=val('f-tipe');
    if(level===3){rec.saldoAwal=parseRp(val('f-sa'));rec.kas=dlg.querySelector('#f-kas').checked}
    if(!edit)db.coa.push(rec);
    sortCoa();closeDlg();commit();toast('Akun '+kode+' tersimpan.');
  };
}
function delCoa(id){
  const a=acc(id);
  if(hasKids(a))return toast('Masih ada akun di bawah '+a.kode+'. Hapus atau pindahkan dulu.');
  if(a.level===3&&Object.values(db.setting).some(o=>Object.values(o).includes(id)))return toast('Akun '+a.kode+' dipakai di Setting. Ganti dulu akunnya di sana.');
  if(a.level===3&&usedAcc(id))return toast('Akun '+a.kode+' sudah dipakai di jurnal, jadi tidak bisa dihapus.');
  if(confirm('Hapus akun '+a.kode+' '+a.nama+'?')){db.coa=db.coa.filter(x=>x.id!==id);commit();toast('Akun dihapus.')}
}

/* --- Kas --- */
function dlgKas(o){
  const rec=o.id?db.kas.find(x=>x.id===o.id):null;
  const jenis=rec?rec.jenis:o.jenis;
  if(!leafs().some(a=>a.kas))return toast('Tandai minimal satu akun sebagai Kas/Bank di CoA dulu.');
  openDlg(`<form novalidate><h2>${rec?'Ubah':'Tambah'} transaksi kas</h2><p class="hint">Jurnal di buku besar dibuat otomatis.</p>
    <div class="row2"><div class="field"><label for="k-tgl">Tanggal</label><input type="date" id="k-tgl" value="${rec?rec.tanggal:defaultDate()}"></div>
    <div class="field"><label for="k-jenis">Jenis</label><select id="k-jenis"><option value="masuk"${jenis==='masuk'?' selected':''}>Kas masuk</option><option value="keluar"${jenis==='keluar'?' selected':''}>Kas keluar</option></select></div></div>
    <div class="row2"><div class="field"><label for="k-kas">Akun kas atau bank</label><select id="k-kas">${accOptions(rec?rec.akunKasId:null,a=>a.kas)}</select></div>
    <div class="field"><label for="k-lawan" id="k-lawan-l"></label><select id="k-lawan">${accOptions(rec?rec.akunLawanId:null,a=>!a.kas)}</select></div></div>
    <div class="field"><label for="k-nom">Nominal (Rp)</label><input type="text" id="k-nom" class="rp" inputmode="numeric" value="${rec?num(rec.nominal):''}"></div>
    <div class="field"><label for="k-ket">Keterangan</label><input type="text" id="k-ket" value="${esc(rec?rec.keterangan:'')}" autocomplete="off"></div>
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Batal</button><button type="submit" class="btn primary">Simpan</button></div></form>`);
  const lbl=()=>{$('#k-lawan-l').textContent=val('k-jenis')==='masuk'?'Diterima dari (akun)':'Dibayarkan untuk (akun)'};
  lbl();dlg.querySelector('#k-jenis').onchange=lbl;
  dlg.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    const d={id:rec?rec.id:null,tanggal:val('k-tgl'),jenis:val('k-jenis'),akunKasId:val('k-kas'),akunLawanId:val('k-lawan'),nominal:parseRp(val('k-nom')),keterangan:val('k-ket').trim()};
    if(!d.tanggal)return setErr('Tanggal wajib diisi.');
    if(!d.akunKasId)return setErr('Pilih akun kas atau bank.');
    if(!d.akunLawanId)return setErr('Pilih akun lawan.');
    if(d.nominal<=0)return setErr('Nominal harus lebih dari 0.');
    if(!d.keterangan)d.keterangan=d.jenis==='masuk'?'Kas masuk':'Kas keluar';
    upsertKas(d);
    if(d.tanggal.slice(0,7)!==ui.periode)ui.periode=d.tanggal.slice(0,7);
    closeDlg();commit();toast('Transaksi kas tersimpan.');
  };
}
function delKas(id){
  const k=db.kas.find(x=>x.id===id);if(!k)return;
  if(confirm('Hapus transaksi kas "'+k.keterangan+'"? Jurnalnya ikut terhapus.')){
    db.jurnal=db.jurnal.filter(j=>j.id!==k.jurnalId);db.kas=db.kas.filter(x=>x.id!==id);commit();toast('Transaksi dihapus.')}
}
function defaultDate(){const t=today();return t.startsWith(ui.periode)?t:ui.periode+'-01'}

/* --- Jurnal manual --- */
function jrRow(b){
  b=b||{};
  return `<tr><td><select class="jr-a" aria-label="Akun">${accOptions(b.akunId)}</select></td>
  <td style="width:140px"><input type="text" class="rp jr-d" inputmode="numeric" aria-label="Debit" value="${b.debit?num(b.debit):''}"></td>
  <td style="width:140px"><input type="text" class="rp jr-k" inputmode="numeric" aria-label="Kredit" value="${b.kredit?num(b.kredit):''}"></td>
  <td style="width:30px"><button type="button" class="lnk danger" data-act="jr-rm" aria-label="Hapus baris">×</button></td></tr>`;
}
function jrTotals(){
  let d=0,k=0;dlg.querySelectorAll('.jr-d').forEach(i=>d+=parseRp(i.value));dlg.querySelectorAll('.jr-k').forEach(i=>k+=parseRp(i.value));
  const ok=d>0&&d===k;
  dlg.querySelector('.jr-sum').innerHTML=`<span>Debit <b>${num(d)}</b></span><span>Kredit <b>${num(k)}</b></span><span class="${ok?'pos':'neg'}">${ok?'Seimbang':'Selisih '+num(d-k)}</span>`;
}
function dlgJurnal(id){
  const j=id?db.jurnal.find(x=>x.id===id):null;
  const baris=j?j.baris:[{},{}];
  openDlg(`<form novalidate><h2>${j?'Ubah':'Tambah'} jurnal manual</h2><p class="hint">Total debit harus sama dengan total kredit.</p>
    <div class="row2"><div class="field"><label for="j-tgl">Tanggal</label><input type="date" id="j-tgl" value="${j?j.tanggal:defaultDate()}"></div>
    <div class="field"><label for="j-ket">Keterangan</label><input type="text" id="j-ket" value="${esc(j?j.keterangan:'')}" autocomplete="off"></div></div>
    <table class="jr-tbl" style="width:100%"><thead><tr><th style="text-align:left">Akun</th><th style="text-align:right">Debit</th><th style="text-align:right">Kredit</th><th></th></tr></thead><tbody id="jr-body">${baris.map(jrRow).join('')}</tbody></table>
    <div class="bar" style="margin:8px 0 0"><button type="button" class="btn sm" data-act="jr-add">+ Tambah baris</button></div>
    <div class="jr-sum"></div><p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Batal</button><button type="submit" class="btn primary">Simpan</button></div></form>`,true);
  jrTotals();
  dlg.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    const tanggal=val('j-tgl'),ket=val('j-ket').trim(),bar=[];
    if(!tanggal)return setErr('Tanggal wajib diisi.');
    let bad=null;
    dlg.querySelectorAll('#jr-body tr').forEach(tr=>{
      const akunId=tr.querySelector('.jr-a').value,debit=parseRp(tr.querySelector('.jr-d').value),kredit=parseRp(tr.querySelector('.jr-k').value);
      if(!akunId&&!debit&&!kredit)return;
      if(!akunId)bad='Setiap baris yang berisi nominal harus punya akun.';
      else if(debit&&kredit)bad='Satu baris hanya boleh diisi di debit atau kredit.';
      else if(!debit&&!kredit)bad='Baris dengan akun harus punya nominal.';
      bar.push({akunId,debit,kredit});
    });
    if(bad)return setErr(bad);
    if(bar.length<2)return setErr('Jurnal minimal punya dua baris.');
    const d=bar.reduce((t,b)=>t+b.debit,0),k=bar.reduce((t,b)=>t+b.kredit,0);
    if(d!==k)return setErr('Debit dan kredit belum seimbang (selisih '+num(d-k)+').');
    upsertJurnal({id:j?j.id:null,tanggal,keterangan:ket||'Jurnal manual',baris:bar});
    if(tanggal.slice(0,7)!==ui.periode)ui.periode=tanggal.slice(0,7);
    closeDlg();commit();toast('Jurnal tersimpan.');
  };
}

/* --- Faktur --- */
function pihakList(t){return [...new Set(db[t].map(d=>d.pihak).filter(Boolean))]}
function dlgDoc(t,id){
  const c=CFG[t],miss=missing(MOD_KEYS[t]);
  if(miss.length)return toast('Atur '+miss.join(', ')+' di menu Setting dulu.');
  if(!db.barang.length)return toast('Tambahkan barang di menu Persediaan dulu.');
  const d=id?db[t].find(x=>x.id===id):null;
  const kasOk=leafs().some(a=>a.kas);
  const st=stockCalc().st||{};
  const bopt=sel=>'<option value="">Pilih barang…</option>'+db.barang.map(b=>`<option value="${b.id}" data-hj="${b.hargaJual||0}"${b.id===sel?' selected':''}>${esc(b.kode+'  '+b.nama)}${t==='penjualan'?' (stok '+(st[b.id]?st[b.id].q:0)+')':''}</option>`).join('');
  const row=i=>`<tr><td><select class="di-b" aria-label="Barang">${bopt(i.barangId)}</select></td>
    <td style="width:84px"><input type="text" class="di-q" inputmode="decimal" aria-label="Jumlah" value="${i.qty||''}"></td>
    <td style="width:130px"><input type="text" class="rp di-h" inputmode="numeric" aria-label="Harga satuan" value="${i.harga?num(i.harga):''}"></td>
    <td class="num di-s" style="width:110px">${i.sub?num(i.sub):'–'}</td>
    <td style="width:28px"><button type="button" class="lnk danger" data-act="di-rm" aria-label="Hapus baris">×</button></td></tr>`;
  dlg.dataset.t=t;dlg.dataset.row=row({}).replace(/\s*\n\s*/g,'');
  openDlg(`<form novalidate><h2>${d?'Ubah':'Tambah'} ${c.doc.toLowerCase()}</h2>
    <p class="hint">${t==='penjualan'?'Stok barang berkurang otomatis dan harga pokok dihitung rata-rata.':'Stok barang bertambah otomatis.'} Jurnal dibuat otomatis.</p>
    <div class="row2"><div class="field"><label for="d-tgl">Tanggal</label><input type="date" id="d-tgl" value="${d?d.tanggal:defaultDate()}"></div>
    <div class="field"><label for="d-pihak">${c.pihak}</label><input type="text" id="d-pihak" list="pihak-list" value="${esc(d?d.pihak:'')}" autocomplete="off"><datalist id="pihak-list">${pihakList(t).map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div></div>
    <div class="field"><label for="d-ket">Keterangan (opsional)</label><input type="text" id="d-ket" value="${esc(d?d.ket||'':'')}" autocomplete="off"></div>
    <div class="tbl-wrap"><table class="jr-tbl" style="width:100%;min-width:520px"><thead><tr><th style="text-align:left">Barang</th><th style="text-align:right">Jumlah</th><th style="text-align:right">Harga satuan</th><th style="text-align:right">Subtotal</th><th></th></tr></thead><tbody id="di-body">${(d?d.items:[{}]).map(row).join('')}</tbody></table></div>
    <div class="bar" style="margin:8px 0 0"><button type="button" class="btn sm" data-act="di-add">+ Tambah baris</button><span class="grow"></span><b>Total: Rp <span id="di-total">0</span></b></div>
    ${d?'':`<div class="row2" style="margin-top:12px"><div class="field"><label for="d-bnom">Dibayar sekarang (Rp, opsional)</label><input type="text" id="d-bnom" class="rp" inputmode="numeric" placeholder="0"><div class="sub">Kosongkan jika belum ada pembayaran. Sisanya tercatat sebagai ${c.sisa.toLowerCase()}.</div></div>
      <div class="field"><label for="d-bkas">Akun kas atau bank</label><select id="d-bkas">${accOptions(null,a=>a.kas)}</select>${kasOk?'':'<div class="sub">Belum ada akun kas. Tandai di CoA.</div>'}</div></div>`}
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Batal</button><button type="submit" class="btn primary">Simpan</button></div></form>`,true);
  diTotals();
  dlg.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    const tanggal=val('d-tgl'),pihak=val('d-pihak').trim(),ket=val('d-ket').trim(),items=[];let bad=null;
    if(!tanggal)return setErr('Tanggal wajib diisi.');
    dlg.querySelectorAll('#di-body tr').forEach(tr=>{
      const b=tr.querySelector('.di-b').value,q=parseQty(tr.querySelector('.di-q').value),h=parseRp(tr.querySelector('.di-h').value);
      if(!b&&!q&&!h)return;
      if(!b)bad='Pilih barang di setiap baris.';else if(!q)bad='Jumlah harus lebih dari 0.';else if(!h)bad='Harga satuan harus lebih dari 0.';
      items.push({barangId:b,qty:q,harga:h,sub:Math.round(q*h)});
    });
    if(bad)return setErr(bad);
    if(!items.length)return setErr('Isi minimal satu barang.');
    const total=items.reduce((a,i)=>a+i.sub,0);
    let bnom=0,bkas='';
    if(!d){bnom=parseRp(val('d-bnom'));bkas=val('d-bkas');
      if(bnom>total)return setErr('Pembayaran melebihi total faktur.');
      if(bnom>0&&!bkas)return setErr('Pilih akun kas atau bank untuk pembayaran.')}
    const err=tryChange(()=>{
      const dd=saveDoc(t,{id:d?d.id:null,tanggal,pihak,ket,items});
      if(bnom>0)addBayar(t,dd.id,{tanggal,akunKasId:bkas,nominal:bnom,ket:'Dibayar saat faktur'});
    });
    if(err)return setErr(err);
    if(tanggal.slice(0,7)!==ui.periode)ui.periode=tanggal.slice(0,7);
    ui[t+'Tab']='faktur';closeDlg();render();toast(c.doc+' tersimpan.');
  };
}
function diTotals(){
  let tot=0;
  dlg.querySelectorAll('#di-body tr').forEach(tr=>{
    const sub=Math.round(parseQty(tr.querySelector('.di-q').value)*parseRp(tr.querySelector('.di-h').value));
    tr.querySelector('.di-s').textContent=sub?num(sub):'–';tot+=sub;
  });
  const el=dlg.querySelector('#di-total');if(el)el.textContent=num(tot);
}
function dlgBayar(t,id){
  const c=CFG[t],d=db[t].find(x=>x.id===id);if(!d)return;
  const tot=totalDoc(d),paid=paidDoc(d),sisa=tot-paid,kasOk=leafs().some(a=>a.kas);
  const items=d.items.map(i=>{const b=db.barang.find(x=>x.id===i.barangId);return `<tr><td>${b?esc(b.nama):'?'}</td><td class="num">${i.qty} ${b?esc(b.satuan):''}</td><td class="num">${num(i.harga)}</td><td class="num">${num(i.sub)}</td></tr>`}).join('');
  const pays=d.bayar.length?d.bayar.map(p=>{const a=acc(p.akunKasId);
    return `<tr><td>${fmtDate(p.tanggal)}</td><td>${a?esc(a.nama):'?'}${p.ket?`<div class="dim" style="font-size:12px">${esc(p.ket)}</div>`:''}</td><td class="num">${num(p.nominal)}</td><td class="act"><button type="button" class="lnk danger" data-act="pay-del" data-t="${t}" data-id="${d.id}" data-p="${p.id}">Hapus</button></td></tr>`}).join('')
    :`<tr><td colspan="4" class="dim">Belum ada pelunasan.</td></tr>`;
  openDlg(`<form novalidate><h2>${c.doc} ${esc(d.nomor)}</h2>
    <p class="hint">${c.pihak}: ${esc(d.pihak||'–')} · ${fmtDate(d.tanggal)} ${statChip(d)}</p>
    <div class="pay-sum"><span>Total<b>${rp(tot)}</b></span><span>Dibayar<b>${rp(paid)}</b></span><span>Sisa ${c.sisa.toLowerCase()}<b class="${sisa?'neg':'pos'}">${rp(sisa)}</b></span></div>
    <div class="tbl-wrap"><table class="tbl" style="margin-bottom:12px"><thead><tr><th>Barang</th><th class="num">Jumlah</th><th class="num">Harga</th><th class="num">Subtotal</th></tr></thead><tbody>${items}</tbody></table></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal bayar</th><th>Akun</th><th class="num">Nominal</th><th></th></tr></thead><tbody>${pays}</tbody></table></div>
    ${sisa>0?`<h2 style="font-size:15px;margin:16px 0 8px">Tambah pelunasan</h2>
    <div class="row2"><div class="field"><label for="p-tgl">Tanggal</label><input type="date" id="p-tgl" value="${defaultDate()}"></div>
    <div class="field"><label for="p-kas">Akun kas atau bank</label><select id="p-kas">${accOptions(null,a=>a.kas)}</select>${kasOk?'':'<div class="sub">Belum ada akun kas. Tandai di CoA.</div>'}</div></div>
    <div class="row2"><div class="field"><label for="p-nom">Nominal (Rp)</label><input type="text" id="p-nom" class="rp" inputmode="numeric" value="${num(sisa)}"><div class="sub"><button type="button" class="lnk" data-act="pay-full" data-sisa="${sisa}" style="padding-left:0">Isi sisa penuh</button> Lunas otomatis jika nominalnya sama dengan sisa.</div></div>
    <div class="field"><label for="p-ket">Keterangan (opsional)</label><input type="text" id="p-ket" autocomplete="off"></div></div>`:''}
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Tutup</button>${sisa>0?'<button type="submit" class="btn primary">Simpan pelunasan</button>':''}</div></form>`,true);
  dlg.querySelector('form').onsubmit=e=>{
    e.preventDefault();if(sisa<=0)return;
    const p={tanggal:val('p-tgl'),akunKasId:val('p-kas'),nominal:parseRp(val('p-nom')),ket:val('p-ket').trim()};
    if(!p.tanggal)return setErr('Tanggal wajib diisi.');
    if(!p.akunKasId)return setErr('Pilih akun kas atau bank.');
    if(p.nominal<=0)return setErr('Nominal harus lebih dari 0.');
    if(p.nominal>sisa)return setErr('Nominal melebihi sisa ('+rp(sisa)+').');
    const snap=JSON.stringify(db);
    try{addBayar(t,id,p)}catch(x){db=JSON.parse(snap);return setErr(x.message)}
    persist();render();dlgBayar(t,id);toast(totalDoc(db[t].find(x=>x.id===id))<=paidDoc(db[t].find(x=>x.id===id))?'Faktur lunas.':'Pelunasan tersimpan.');
  };
}

/* --- Barang & penyesuaian stok --- */
function dlgBarang(id){
  const b=id?db.barang.find(x=>x.id===id):null;
  const n=Math.max(0,...db.barang.map(x=>{const m=/^BRG-(\d+)$/.exec(x.kode);return m?+m[1]:0}))+1;
  openDlg(`<form novalidate><h2>${b?'Ubah':'Tambah'} barang</h2><p class="hint">Stok awal dan nilainya dibiarkan 0 jika belum ada.</p>
    <div class="row2"><div class="field"><label for="b-kode">Kode</label><input type="text" id="b-kode" value="${esc(b?b.kode:'BRG-'+pad3(n))}" autocomplete="off"></div>
    <div class="field"><label for="b-nama">Nama barang</label><input type="text" id="b-nama" value="${esc(b?b.nama:'')}" autocomplete="off"></div></div>
    <div class="row2"><div class="field"><label for="b-sat">Satuan</label><input type="text" id="b-sat" value="${esc(b?b.satuan:'pcs')}" autocomplete="off"></div>
    <div class="field"><label for="b-hj">Harga jual (Rp)</label><input type="text" id="b-hj" class="rp" inputmode="numeric" value="${b&&b.hargaJual?num(b.hargaJual):''}" placeholder="0"></div></div>
    <div class="row2"><div class="field"><label for="b-min">Stok minimum</label><input type="text" id="b-min" inputmode="decimal" value="${b&&b.stokMin?b.stokMin:''}" placeholder="0"><div class="sub">Barang diberi tanda "Menipis" jika stoknya sama dengan atau di bawah angka ini.</div></div><div></div></div>
    <div class="row2"><div class="field"><label for="b-sa">Stok awal (jumlah)</label><input type="text" id="b-sa" inputmode="decimal" value="${b&&b.stokAwal?b.stokAwal:''}" placeholder="0"></div>
    <div class="field"><label for="b-na">Nilai stok awal (Rp)</label><input type="text" id="b-na" class="rp" inputmode="numeric" value="${b&&b.nilaiAwal?num(b.nilaiAwal):''}" placeholder="0"><div class="sub">Total nilai, bukan harga satuan. Samakan dengan saldo awal akun Persediaan di CoA.</div></div></div>
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Batal</button><button type="submit" class="btn primary">Simpan</button></div></form>`);
  dlg.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    const o={kode:val('b-kode').trim(),nama:val('b-nama').trim(),satuan:val('b-sat').trim()||'pcs',hargaJual:parseRp(val('b-hj')),stokMin:parseQty(val('b-min')),stokAwal:parseQty(val('b-sa')),nilaiAwal:parseRp(val('b-na'))};
    if(!o.kode)return setErr('Kode barang wajib diisi.');
    if(!o.nama)return setErr('Nama barang wajib diisi.');
    if(o.stokAwal===0&&o.nilaiAwal>0)return setErr('Nilai stok awal diisi tapi jumlahnya 0.');
    const err=tryChange(()=>saveBarang(Object.assign({id:id||null},o)));
    if(err)return setErr(err);
    closeDlg();render();toast('Barang tersimpan.');
  };
}
function dlgAdj(){
  const miss=missing(MOD_KEYS.persediaan);
  if(miss.length)return toast('Atur '+miss.join(', ')+' di menu Setting dulu.');
  if(!db.barang.length)return toast('Tambahkan barang dulu.');
  const st=stockCalc().st||{};
  openDlg(`<form novalidate><h2>Penyesuaian stok</h2><p class="hint">Selisih bertambah dinilai dengan harga rata-rata saat itu. Selisih berkurang dikurangkan dari stok dan dijurnal sebagai selisih persediaan.</p>
    <div class="row2"><div class="field"><label for="a-tgl">Tanggal</label><input type="date" id="a-tgl" value="${defaultDate()}"></div>
    <div class="field"><label for="a-b">Barang</label><select id="a-b"><option value="">Pilih barang…</option>${db.barang.map(b=>`<option value="${b.id}">${esc(b.kode+'  '+b.nama)} (stok ${st[b.id]?st[b.id].q:0})</option>`).join('')}</select></div></div>
    <div class="row2"><div class="field"><label for="a-j">Jenis</label><select id="a-j"><option value="kurang">Stok berkurang (rusak, hilang, kurang)</option><option value="tambah">Stok bertambah (lebih saat dihitung)</option></select></div>
    <div class="field"><label for="a-q">Jumlah</label><input type="text" id="a-q" inputmode="decimal"></div></div>
    <div class="field"><label for="a-k">Keterangan</label><input type="text" id="a-k" placeholder="Contoh: hasil hitung fisik" autocomplete="off"></div>
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Batal</button><button type="submit" class="btn primary">Simpan</button></div></form>`);
  dlg.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    const tanggal=val('a-tgl'),barangId=val('a-b'),q=parseQty(val('a-q')),ket=val('a-k').trim();
    if(!tanggal)return setErr('Tanggal wajib diisi.');
    if(!barangId)return setErr('Pilih barang.');
    if(!q)return setErr('Jumlah harus lebih dari 0.');
    const err=tryChange(()=>saveAdj({tanggal,barangId,qty:val('a-j')==='kurang'?-q:q,ket}));
    if(err)return setErr(err);
    if(tanggal.slice(0,7)!==ui.periode)ui.periode=tanggal.slice(0,7);
    ui.stokTab='adj';closeDlg();render();toast('Penyesuaian tersimpan.');
  };
}

/* --- Ekspor / impor --- */
function doExport(){
  db.terakhirEkspor=new Date().toISOString();persist();
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bukuku-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  render();toast('File cadangan diunduh.');
}
function doImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d||!Array.isArray(d.coa)||!Array.isArray(d.jurnal)||!Array.isArray(d.kas))throw new Error('format');
      if(!confirm('Ganti seluruh data saat ini dengan isi file ini?'))return;
      db=migrate(d);sortCoa();commit();toast('Data berhasil diimpor.');
    }catch(e){toast('File tidak valid. Pilih file JSON hasil ekspor Bukuku.')}
  };
  fr.readAsText(file);
}

/* ============ Event ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='go')e.preventDefault();
  switch(a){
    case 'go':go(id);break;
    case 'menu':$('#side').classList.add('open');$('#scrim').classList.add('open');break;
    case 'side-close':closeSide();break;
    case 'per-prev':ui.periode=shiftP(ui.periode,-1);render();break;
    case 'per-next':ui.periode=shiftP(ui.periode,1);render();break;
    case 'tab':ui[t.dataset.k]=t.dataset.v;render();break;
    case 'dlg-close':closeDlg();break;
    case 'coa-add-head':dlgCoa({level:1});break;
    case 'coa-add-sub':dlgCoa({level:2,parentId:id});break;
    case 'coa-add-akun':dlgCoa({level:3,parentId:id});break;
    case 'coa-edit':dlgCoa({id});break;
    case 'coa-del':delCoa(id);break;
    case 'kas-add':dlgKas({jenis:id});break;
    case 'kas-edit':ui.kasTab='kas';dlgKas({id});break;
    case 'kas-del':delKas(id);break;
    case 'jurnal-add':dlgJurnal();break;
    case 'jurnal-edit':dlgJurnal(id);break;
    case 'jurnal-del':if(confirm('Hapus jurnal ini?')){db.jurnal=db.jurnal.filter(j=>j.id!==id);commit();toast('Jurnal dihapus.')}break;
    case 'jr-add':{const tb=dlg.querySelector('#jr-body');tb.insertAdjacentHTML('beforeend',jrRow());break}
    case 'jr-rm':{const tb=dlg.querySelector('#jr-body');if(tb.rows.length>2){t.closest('tr').remove();jrTotals()}break}
    case 'doc-add':dlgDoc(t.dataset.t);break;
    case 'doc-edit':dlgDoc(t.dataset.t,id);break;
    case 'doc-open':dlgBayar(t.dataset.t,id);break;
    case 'doc-del':{const T=t.dataset.t,d=db[T].find(x=>x.id===id);
      if(d&&confirm('Hapus '+d.nomor+'? Jurnal dan pelunasannya ikut terhapus.')){const err=tryChange(()=>delDoc(T,id));if(err)toast(err);else{render();toast('Faktur dihapus.')}}break}
    case 'di-add':dlg.querySelector('#di-body').insertAdjacentHTML('beforeend',dlg.dataset.row);break;
    case 'di-rm':{const tb=dlg.querySelector('#di-body');if(tb.rows.length>1){t.closest('tr').remove();diTotals()}break}
    case 'pay-del':if(confirm('Hapus pelunasan ini?')){const T=t.dataset.t,snap=JSON.stringify(db);try{delBayar(T,id,t.dataset.p);persist();render();dlgBayar(T,id);toast('Pelunasan dihapus.')}catch(x){db=JSON.parse(snap);toast(x.message)}}break;
    case 'pay-full':dlg.querySelector('#p-nom').value=num(+t.dataset.sisa);break;
    case 'barang-add':dlgBarang();break;
    case 'barang-edit':dlgBarang(id);break;
    case 'barang-del':if(confirm('Hapus barang ini?')){const err=tryChange(()=>delBarang(id));if(err)toast(err);else{render();toast('Barang dihapus.')}}break;
    case 'adj-add':dlgAdj();break;
    case 'adj-del':if(confirm('Hapus penyesuaian ini?')){const err=tryChange(()=>delAdj(id));if(err)toast(err);else{render();toast('Penyesuaian dihapus.')}}break;
    case 'go-stok':ui.stokTab='adj';go('persediaan');break;
    case 'export':doExport();break;
    case 'import':$('#file').click();break;
    case 'reset-trx':if(confirm('Hapus semua transaksi? Daftar akun, saldo awal, barang, dan setting tetap ada.')){db.jurnal=[];db.kas=[];db.penjualan=[];db.pembelian=[];db.penyesuaian=[];commit();toast('Semua transaksi dihapus.')}break;
    case 'reset-sample':if(confirm('Ganti semua data dengan data awal? Semua transaksi dan saldo awal akan dihapus.')){resetSample();render();toast('Data awal dimuat.')}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('rp')){
    const v=parseRp(t.value);t.value=v?num(v):'';
    if(t.classList.contains('jr-d')||t.classList.contains('jr-k'))jrTotals();
  }
  if(t.closest&&t.closest('#di-body'))diTotals();
  if(t.id==='coaQ'){ui.coaQ=t.value;const pos=t.selectionStart;render();const n=$('#coaQ');n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==='co'){db.perusahaan=t.value.trim()||'Nama Perusahaan';persist();$('#brandCo').textContent=db.perusahaan}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='periode'&&/^\d{4}-\d{2}$/.test(t.value)){ui.periode=t.value;render()}
  if(t.classList&&t.classList.contains('di-b')){
    const h=t.closest('tr').querySelector('.di-h'),hj=t.selectedOptions[0]&&t.selectedOptions[0].dataset.hj;
    if(dlg.dataset.t==='penjualan'&&hj&&+hj>0&&!parseRp(h.value))h.value=num(+hj);
    diTotals();
  }
  if(t.dataset&&t.dataset.set){const [a,b]=t.dataset.set.split('.');db.setting[a][b]=t.value;persist();render();toast('Pengaturan tersimpan.')}
  if(t.dataset&&t.dataset.bind){const k=t.dataset.bind;ui[k]=k==='histAll'?t.value==='1':t.value;render()}
  if(t.id==='file'&&t.files[0]){doImport(t.files[0]);t.value=''}
});
window.addEventListener('hashchange',route);

/* ============ Mulai ============ */
db=load();
if(!db){resetSample()}
sortCoa();
route();
})();
</script>
</body>
</html>
