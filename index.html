<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akuntansi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#16262B; --muted:#5A6C72;
  --line:#D6DFDD; --line-soft:#E7EDEB;
  --side:#14323D; --side-ink:#CFE0E5; --side-active:#21505F; --side-muted:#8BA5AD;
  --accent:#1B5E73; --accent-ink:#FFFFFF; --accent-soft:#E1EEF2;
  --pos:#1B7A52; --neg:#B23A2E; --amber:#B9772B;
  --warn:#7A4E00; --warn-bg:#FBF1DA; --ok-bg:#DDF0E6; --bad-bg:#F8E1DD;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E181C; --surface:#15252B; --ink:#E4EEF0; --muted:#93A8AE;
    --line:#2A3D44; --line-soft:#21323A;
    --side:#0A1317; --side-ink:#C4D6DA; --side-active:#1A3540; --side-muted:#6F8A92;
    --accent:#5FB4CC; --accent-ink:#06222B; --accent-soft:#193642;
    --pos:#54C48F; --neg:#F08A7C; --amber:#E0A35A;
    --warn:#E3B866; --warn-bg:#2D2512; --ok-bg:#15332A; --bad-bg:#3A1F1B;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px 16px;overflow:auto}
.brand{padding:0 10px 18px}
.brand b{display:block;font-size:19px;font-weight:600;letter-spacing:.2px;color:#fff}
.brand span{display:block;font-size:12.5px;color:var(--side-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--side-active);border-left-color:#8CD3E6;color:#fff;font-weight:500}
.nav small{font-size:11.5px;color:var(--side-muted)}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:10px 4px}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--side-muted)}

.main-wrap{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:600;margin:0;flex:1}
.menu-btn{display:none}
.period{display:flex;align-items:center;gap:4px}
.period button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer;font-size:18px;line-height:1}
.period input{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:0 8px}
main{padding:22px 24px 60px;max-width:1180px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.panel>h2,.panel-h{font-size:15px;font-weight:600;margin:0;padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:16px;border-right:1px solid var(--line-soft)}
.stat:last-child{border-right:0}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat b{display:block;font-size:21px;font-weight:600;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.tabs{display:flex;overflow-x:auto;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.lnk{background:none;border:0;padding:2px 6px;color:var(--accent);cursor:pointer;font-size:13px;border-radius:4px}
.lnk:hover{background:var(--accent-soft)}
.lnk.danger{color:var(--neg)}
input[type=text],input[type=date],input[type=search],input[type=month],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 10px;width:100%;min-height:36px}
.bar input[type=search],.bar select{width:auto;min-width:200px}

.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .act{text-align:right;white-space:nowrap}
.tbl .kode{font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap;width:1%}
.tbl tr.lv1 td{background:var(--accent-soft);font-weight:600}
.tbl tr.lv2 td{font-weight:500;background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.tbl tr.lv2 .nm{padding-left:24px}
.tbl tr.lv3 .nm{padding-left:48px;position:relative}
.tbl tr.lv3 .nm::before{content:"";position:absolute;left:36px;top:0;bottom:0;border-left:1px solid var(--line)}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--line)}
.tbl tr.sub td{color:var(--muted)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line)}
.dim{color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500;vertical-align:1px;margin-left:6px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--pos)} .chip.bad{background:var(--bad-bg);color:var(--neg)} .chip.warn{background:var(--warn-bg);color:var(--warn)}

.jr{border-bottom:1px solid var(--line-soft);padding:12px 16px}
.jr:last-child{border-bottom:0}
.jr-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.jr-h .tgl{font-weight:600;font-variant-numeric:tabular-nums}
.jr-h .ket{flex:1;min-width:160px}
.jr .tbl td{padding:3px 12px;border:0}
.jr .tbl .cr{padding-left:40px}

.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.soon ul{margin:8px 0 0;padding-left:18px;color:var(--ink)} .soon li{margin:5px 0}
.note{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:6px;margin-bottom:16px}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line-soft)}
.checks li:last-child{border-bottom:0}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.chart{display:flex;gap:12px;height:160px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.chart .bars{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.chart .bars i{display:block;width:42%;max-width:24px;min-height:2px;border-radius:2px 2px 0 0}
.chart span{font-size:12px;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:10px;padding:22px;width:min(540px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(780px,96vw)}
dialog::backdrop{background:rgba(8,22,27,.55)}
dialog h2{margin:0 0 4px;font-size:17px}
dialog .hint{margin:0 0 14px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-weight:500;font-size:13px}
.field .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.err{color:var(--neg);min-height:20px;margin:4px 0 0}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.jr-tbl td{padding:4px 4px 4px 0;border:0}
.jr-tbl th{padding:4px 4px 4px 0}
.jr-tbl input.rp{text-align:right}
.jr-sum{display:flex;justify-content:flex-end;gap:22px;margin:10px 0;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;max-width:92vw;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}
.scrim{display:none}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:14px 16px;border-bottom:1px solid var(--line-soft);align-items:start}
.setrow:last-child{border-bottom:0}
.setrow b{display:block;font-weight:500}
.setrow small{display:block;color:var(--muted);margin-top:2px}
.jr-tbl input.di-q{text-align:right}
.jr-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pay-sum{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 12px;font-variant-numeric:tabular-nums}
.pay-sum span{color:var(--muted)} .pay-sum b{color:var(--ink);font-weight:600;margin-left:4px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:20;left:0;top:0;width:250px;transform:translateX(-100%);transition:transform .18s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(8,22,27,.5);z-index:15}
  .menu-btn{display:inline-block}
  .top{padding:10px 14px}
  main{padding:16px 14px 50px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line-soft)}
  .grid2{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .setrow{grid-template-columns:1fr;gap:8px}
  .stats.s3{grid-template-columns:1fr}
  .stats.s3 .stat{border-right:0;border-bottom:1px solid var(--line-soft)}
}
@media (max-width:520px){
  .top h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .period input{width:128px}
  .tbl th,.tbl td{padding-left:8px;padding-right:8px}
  .tbl tr.lv2 .nm{padding-left:12px}
  .tbl tr.lv3 .nm{padding-left:26px}
  .tbl tr.lv3 .nm::before{left:16px}
  .tbl .nm,.tbl td:nth-child(2){min-width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu utama">
    <div class="brand"><b>Akuntansi</b><span id="brandCo"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Data tersimpan di browser ini. Simpan ke cloud atau ekspor berkala dari menu Data &amp; cadangan.</div>
  </aside>
  <div class="scrim" id="scrim" data-act="side-close"></div>
  <div class="main-wrap">
    <header class="top">
      <button class="btn sm menu-btn" data-act="menu" aria-label="Buka menu">Menu</button>
      <h1 id="title"></h1>
      <span class="chip warn" id="lockChip" hidden style="margin:0">Periode terkunci</span>
      <div class="period" id="period">
        <button type="button" data-act="per-prev" aria-label="Periode sebelumnya">‹</button>
        <input type="month" id="periode" aria-label="Periode">
        <button type="button" data-act="per-next" aria-label="Periode berikutnya">›</button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ============ Utilitas ============ */
const KEY='akuntansi:v1';        // prefix unik supaya tidak bentrok dengan proyek lain di akun GitHub yang sama
const OLD_KEY='bukuku:v1';       // nama lama, dibaca sekali agar data lama tidak hilang
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const num=n=>Math.round(Math.abs(n||0)).toLocaleString('id-ID');
const fmt=n=>{n=Math.round(n||0);return n===0?'–':(n<0?'-':'')+num(n)};
const rp=n=>'Rp '+((n||0)<0?'-':'')+num(n);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curP=()=>today().slice(0,7);
const perLabel=p=>BULAN[+p.slice(5)-1]+' '+p.slice(0,4);
const fmtDate=t=>t?(+t.slice(8))+' '+BLN[+t.slice(5,7)-1]+' '+t.slice(0,4):'';
const parseRp=v=>parseInt(String(v||'').replace(/\D/g,''),10)||0;
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shiftP=(p,d)=>{let y=+p.slice(0,4),m=+p.slice(5)+d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)};

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)}

/* ============ Data ============ */
let db;
const TIPE={aset:'Aset',kewajiban:'Kewajiban',ekuitas:'Ekuitas',pendapatan:'Pendapatan',hpp:'HPP',beban:'Beban'};
const SUMBER={manual:'Manual',kas:'Kas',penjualan:'Penjualan',pembelian:'Pembelian',persediaan:'Persediaan'};

function emptyDb(){
  return {versi:3,perusahaan:'Nama Perusahaan',coa:[],jurnal:[],kas:[],penjualan:[],pembelian:[],retur:[],barang:[],penyesuaian:[],kunci:{},tutupBuku:{},setting:{penjualan:{},pembelian:{},persediaan:{},tutup:{}},terakhirEkspor:null};
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Gagal menyimpan ke browser. Ekspor data Anda segera.')}}
function migrate(d){
  const b=emptyDb();Object.keys(b).forEach(k=>{if(d[k]===undefined)d[k]=b[k]});
  ['penjualan','pembelian','persediaan','tutup'].forEach(k=>{if(!d.setting[k])d.setting[k]={}});
  if((d.versi||0)>=3)autoSetting(d);
  return d;
}
function autoSetting(d){
  const map={'penjualan.piutang':'1-1-3','penjualan.pendapatan':'4-1-1','penjualan.diskon':'4-1-2','penjualan.retur':'4-1-3',
    'pembelian.utang':'2-1-1','persediaan.persediaan':'1-1-4','persediaan.hpp':'5-1-1','persediaan.selisih':'5-2-1','tutup.labaDitahan':'3-2-1'};
  Object.keys(map).forEach(p=>{const [a,b]=p.split('.');
    if(d.setting[a][b]===undefined){const x=d.coa.find(c=>c.level===3&&c.kode===map[p]);if(x)d.setting[a][b]=x.id}});
}
function load(){
  for(const k of [KEY,OLD_KEY]){
    try{const r=localStorage.getItem(k);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.coa))return migrate(d)}}catch(e){}
  }
  return null;
}
function seedCoa(){
  const A=(kode,nama,extra)=>Object.assign({id:uid(),kode,nama,level:kode.split('-').length,saldoAwal:0},extra||{});
  return [
    A('1','Aset',{tipe:'aset'}),
      A('1-1','Aset Lancar'),
        A('1-1-1','Kas',{kas:true}),
        A('1-1-2','Bank',{kas:true}),
        A('1-1-3','Piutang Usaha'),
        A('1-1-4','Persediaan Barang'),
      A('1-2','Aset Tetap'),
        A('1-2-1','Peralatan'),
    A('2','Kewajiban',{tipe:'kewajiban'}),
      A('2-1','Kewajiban Lancar'),
        A('2-1-1','Utang Usaha'),
    A('3','Ekuitas',{tipe:'ekuitas'}),
      A('3-1','Modal'),
        A('3-1-1','Modal Pemilik'),
      A('3-2','Laba Ditahan'),
        A('3-2-1','Laba Ditahan'),
    A('4','Pendapatan',{tipe:'pendapatan'}),
      A('4-1','Pendapatan Usaha'),
        A('4-1-1','Penjualan'),
        A('4-1-2','Diskon Penjualan',{normal:'D'}),
        A('4-1-3','Retur Penjualan',{normal:'D'}),
    A('5','Harga Pokok Penjualan',{tipe:'hpp'}),
      A('5-1','HPP Barang Dagang'),
        A('5-1-1','HPP Barang Dagang'),
      A('5-2','Penyesuaian Persediaan'),
        A('5-2-1','Selisih Persediaan'),
    A('6','Beban',{tipe:'beban'}),
      A('6-1','Beban Operasional'),
        A('6-1-1','Beban Gaji'),
        A('6-1-2','Beban Sewa'),
        A('6-1-3','Beban Listrik & Air')
  ];
}
function resetSample(){db=emptyDb();db.coa=seedCoa();autoSetting(db);persist()}

/* ============ Akun ============ */
const acc=id=>db.coa.find(a=>a.id===id);
const cmpKode=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);
  for(let i=0;i<Math.max(x.length,y.length);i++){const d=(i<x.length?x[i]:-1)-(i<y.length?y[i]:-1);if(d)return d}return 0};
const sortCoa=()=>db.coa.sort((a,b)=>cmpKode(a.kode,b.kode));
const headOf=a=>db.coa.find(x=>x.level===1&&x.kode===a.kode.split('-')[0]);
const tipeOf=a=>{const h=headOf(a);return h&&h.tipe?h.tipe:'aset'};
const defNormal=a=>(['aset','hpp','beban'].includes(tipeOf(a)))?'D':'K';
const normalOf=a=>a.normal||defNormal(a);
const parentOf=a=>{const p=a.kode.split('-').slice(0,-1).join('-');return p?db.coa.find(x=>x.kode===p):null};
const leafs=()=>db.coa.filter(a=>a.level===3);
const hasKids=a=>db.coa.some(x=>x.kode.startsWith(a.kode+'-'));
const usedAcc=id=>db.jurnal.some(j=>j.baris.some(b=>b.akunId===id));
function nextKode(level,parent){
  if(level===1){return String(Math.max(0,...db.coa.filter(x=>x.level===1).map(x=>+x.kode))+1)}
  const kids=db.coa.filter(x=>x.level===level&&x.kode.startsWith(parent.kode+'-'));
  return parent.kode+'-'+(Math.max(0,...kids.map(x=>+x.kode.split('-').pop()))+1);
}
function accOptions(sel,filter){
  let out='<option value="">Pilih akun…</option>';
  db.coa.filter(a=>a.level===2).forEach(sh=>{
    const items=leafs().filter(a=>a.kode.startsWith(sh.kode+'-')&&(!filter||filter(a)));
    if(!items.length)return;
    out+=`<optgroup label="${esc(sh.kode+' '+sh.nama)}">`+items.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.kode+'  '+a.nama)}</option>`).join('')+'</optgroup>';
  });
  return out;
}

/* ============ Jurnal (pusat semua transaksi) ============ */
function nomorBaru(prefix,tanggal){
  const pre=prefix+'-'+tanggal.slice(0,7).replace('-','')+'-';let max=0;
  db.jurnal.forEach(j=>{if(j.nomor&&j.nomor.startsWith(pre)){const n=parseInt(j.nomor.slice(pre.length),10);if(n>max)max=n}});
  return pre+pad3(max+1);
}
const pad3=n=>String(n).padStart(3,'0');
function nomorCocok(nomor,prefix,tanggal){return nomor&&nomor.startsWith(prefix+'-'+tanggal.slice(0,7).replace('-','')+'-')}

function upsertJurnal(data){ // jurnal manual
  let j=data.id&&db.jurnal.find(x=>x.id===data.id);
  if(!j){j={id:uid(),sumber:'manual',ref:null,nomor:null};db.jurnal.push(j)}
  if(!nomorCocok(j.nomor,'JU',data.tanggal)){j.nomor=null;j.nomor=nomorBaru('JU',data.tanggal)}
  j.tanggal=data.tanggal;j.keterangan=data.keterangan;j.baris=data.baris;
  return j;
}
function upsertKas(k){
  let rec=k.id&&db.kas.find(x=>x.id===k.id);
  if(!rec){rec={id:uid(),jurnalId:uid()};db.kas.push(rec)}
  let j=db.jurnal.find(x=>x.id===rec.jurnalId);
  if(!j){j={id:rec.jurnalId,nomor:null};db.jurnal.push(j)}
  const prefix=k.jenis==='masuk'?'KM':k.jenis==='transfer'?'KT':'KK';
  if(!nomorCocok(j.nomor,prefix,k.tanggal)){j.nomor=null;j.nomor=nomorBaru(prefix,k.tanggal)}
  Object.assign(rec,{tanggal:k.tanggal,jenis:k.jenis,akunKasId:k.akunKasId,akunLawanId:k.akunLawanId,nominal:k.nominal,keterangan:k.keterangan});
  const baris=k.jenis==='masuk'
    ?[{akunId:k.akunKasId,debit:k.nominal,kredit:0},{akunId:k.akunLawanId,debit:0,kredit:k.nominal}]
    :[{akunId:k.akunLawanId,debit:k.nominal,kredit:0},{akunId:k.akunKasId,debit:0,kredit:k.nominal}];
  Object.assign(j,{tanggal:k.tanggal,keterangan:k.keterangan,sumber:'kas',ref:rec.id,baris});
  return rec;
}

  pembelian:{label:'Pembelian',doc:'Faktur pembelian',pihak:'Pemasok',jp:'JB',bp:'BB',np:'PB',rn:'RTB',rj:'JTB',sisa:'Utang'}
};
const SETTINGS=[
  {k:'penjualan.piutang',m:'penjualan',l:'Akun piutang usaha',h:'Bertambah saat faktur penjualan dibuat, berkurang saat pelunasan atau retur.'},
  {k:'penjualan.pendapatan',m:'penjualan',l:'Akun pendapatan penjualan',h:'Dikredit sebesar nilai faktur sebelum diskon.'},

  {k:'penjualan.retur',m:'penjualan',l:'Akun retur penjualan',h:'Pengurang pendapatan saat barang diretur pelanggan. Disarankan akun dengan sisi normal debit.'},
  {k:'pembelian.utang',m:'pembelian',l:'Akun utang usaha',h:'Bertambah saat faktur pembelian dibuat, berkurang saat pelunasan atau retur. Diskon pembelian otomatis mengurangi harga pokok stok.'},
  {k:'persediaan.persediaan',m:'persediaan',l:'Akun persediaan barang',h:'Bertambah dari pembelian, berkurang dari penjualan.'},

  {k:'tutup.labaDitahan',m:'tutup',l:'Akun laba ditahan',h:'Menampung laba atau rugi saat tutup buku tahunan.'}
];
const HARI=[
  {k:'penjualan.hari',m:'penjualan',l:'Jatuh tempo piutang (hari)',h:'Jatuh tempo otomatis = tanggal faktur + jumlah hari ini. Isi 0 untuk tunai. Bisa diubah di tiap faktur.'},
  {k:'pembelian.hari',m:'pembelian',l:'Jatuh tempo utang (hari)',h:'Jatuh tempo otomatis = tanggal faktur + jumlah hari ini. Isi 0 untuk tunai. Bisa diubah di tiap faktur.'}
];
const MOD_KEYS={
  penjualan:['penjualan.piutang','penjualan.pendapatan','persediaan.persediaan','persediaan.hpp'],
  pembelian:['pembelian.utang','persediaan.persediaan'],
  persediaan:['persediaan.persediaan','persediaan.selisih']
};
const sget=k=>{const [a,b]=k.split('.');return db.setting[a]&&db.setting[a][b]};
const missing=keys=>keys.filter(k=>{const id=sget(k);return !id||!acc(id)}).map(k=>SETTINGS.find(x=>x.k===k).l.toLowerCase());
const hariDefault=t=>{const v=db.setting[t]&&db.setting[t].hari;return(v===undefined||v===null||v==='')?30:+v};
const r3=x=>Math.round(x*1000)/1000;
const parseQty=v=>{const x=parseFloat(String(v||'').replace(',','.'));return isFinite(x)&&x>0?r3(x):0};
const barangNama=id=>{const b=db.barang.find(x=>x.id===id);return b?b.nama:'?'};
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function lastDayOf(p){const y=+p.slice(0,4),m=+p.slice(5,7);return p+'-'+pad(new Date(y,m,0).getDate())}
function daysBetween(a,b){const f=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));return Math.round((f(b)-f(a))/86400000)}

function setJurnal(jid,o){
  let j=db.jurnal.find(x=>x.id===jid);
  if(!j){j={id:jid,nomor:null};db.jurnal.push(j)}
  if(!nomorCocok(j.nomor,o.prefix,o.tanggal)){j.nomor=null;j.nomor=nomorBaru(o.prefix,o.tanggal)}
  Object.assign(j,{tanggal:o.tanggal,keterangan:o.keterangan,sumber:o.sumber,ref:o.ref,payId:o.payId||null,retId:o.retId||null,baris:o.baris});
  return j;
}
const delJurnal=id=>{db.jurnal=db.jurnal.filter(j=>j.id!==id)};

/* --- kunci periode --- */
const isLocked=tgl=>!!db.kunci[tgl.slice(0,7)];
const lockedSig=()=>JSON.stringify(db.jurnal.filter(j=>isLocked(j.tanggal)).map(j=>[j.id,j.tanggal,j.baris.map(b=>[b.akunId,b.debit,b.kredit])]).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0));
// jalankan perubahan; batalkan semuanya jika stok minus atau jurnal di periode terkunci ikut berubah
function tryChange(fn){
  const snap=JSON.stringify(db),before=lockedSig();
  try{
    fn();
    const err=syncStock();
    if(err){db=JSON.parse(snap);return err}
    if(lockedSig()!==before){db=JSON.parse(snap);return 'Perubahan ini akan mengubah jurnal di periode yang sudah dikunci. Buka kunci periodenya dulu di Laporan, tab Kunci periode.'}
  }catch(e){db=JSON.parse(snap);return e.message}
  persist();return null;
}

/* --- hitung stok (rata-rata bergerak) --- */
const itemNet=i=>i.net!=null?i.net:i.sub;
function stockCalc(){
  const ev=[];let seq=0;
  db.barang.forEach(b=>ev.push({seq:seq++,tgl:'0000-00-00',pr:0,b:b.id,kind:'awal',qty:b.stokAwal||0,val:b.nilaiAwal||0,ref:'',ket:'Stok awal'}));
  db.pembelian.forEach(d=>d.items.forEach(it=>ev.push({seq:seq++,tgl:d.tanggal,pr:1,b:it.barangId,kind:'beli',qty:it.qty,val:itemNet(it),ref:d.nomor,ket:'Pembelian'+(d.pihak?' – '+d.pihak:'')})));
  db.penyesuaian.forEach(a=>ev.push({seq:seq++,tgl:a.tanggal,pr:2,b:a.barangId,kind:'adj',qty:a.qty,ref:'Penyesuaian',ket:a.ket||'Penyesuaian stok',adjId:a.id}));
  db.penjualan.forEach(d=>d.items.forEach((it,i)=>ev.push({seq:seq++,tgl:d.tanggal,pr:3,b:it.barangId,kind:'jual',qty:it.qty,ref:d.nomor,ket:'Penjualan'+(d.pihak?' – '+d.pihak:''),key:d.id+':'+i})));
  db.retur.forEach(r=>{
    const f=db[r.jenis].find(x=>x.id===r.fakturId);
    r.items.forEach((it,i)=>{
      const key=r.id+':'+i;
      if(r.jenis==='penjualan'){const fi=f&&f.items[it.idx];
        ev.push({seq:seq++,tgl:r.tanggal,pr:3.5,b:it.barangId,kind:'rjual',qty:it.qty,ref:r.nomor,ket:'Retur penjualan'+(f&&f.pihak?' – '+f.pihak:''),key,origKey:r.fakturId+':'+it.idx,origQty:fi?fi.qty:0})}
      else ev.push({seq:seq++,tgl:r.tanggal,pr:3.6,b:it.barangId,kind:'rbeli',qty:it.qty,ref:r.nomor,ket:'Retur pembelian'+(f&&f.pihak?' – '+f.pihak:''),key})});
  });
  ev.sort((x,y)=>x.tgl<y.tgl?-1:x.tgl>y.tgl?1:(x.pr-y.pr)||(x.seq-y.seq));
  const st={},kartu={},hpp={},adj={},ret={};
  db.barang.forEach(b=>{st[b.id]={q:0,v:0,avg:0};kartu[b.id]=[]});
  for(const e of ev){
    const s=st[e.b];if(!s)continue;
    let masuk=0,keluar=0,nilai=0;
    const inn=(q,v)=>{s.q=r3(s.q+q);s.v+=v;if(s.q>0)s.avg=s.v/s.q};
    if(e.kind==='awal'||e.kind==='beli'){inn(e.qty,e.val);masuk=e.qty;nilai=e.val}
    else if(e.kind==='adj'&&e.qty>0){const v=Math.round(s.avg*e.qty);inn(e.qty,v);masuk=e.qty;nilai=v;adj[e.adjId]=v}
    else if(e.kind==='rjual'){const v=e.origQty?Math.round((hpp[e.origKey]||0)*e.qty/e.origQty):0;inn(e.qty,v);masuk=e.qty;nilai=v;ret[e.key]=v}
    else{
      const q=Math.abs(e.qty);
      if(q>s.q+1e-9){const b=db.barang.find(x=>x.id===e.b);
        return {err:'Stok '+b.nama+' tidak cukup pada '+fmtDate(e.tgl)+': tersedia '+s.q+', dibutuhkan '+q+'.',kartu,hpp,adj,ret,st}}
      const c=q>=s.q-1e-9?s.v:Math.round(s.v*q/s.q);
      s.q=r3(s.q-q);s.v-=c;if(s.q<=0){s.q=0;s.v=0}
      keluar=q;nilai=c;
      if(e.kind==='jual')hpp[e.key]=c;else if(e.kind==='rbeli')ret[e.key]=c;else adj[e.adjId]=-c;
    }
    if(e.kind==='awal'&&!masuk&&!nilai)continue;
    kartu[e.b].push({tgl:e.tgl,ref:e.ref,ket:e.ket,masuk,keluar,nilai,sq:s.q,sv:s.v});
  }
  return {err:null,kartu,hpp,adj,ret,st};
}
function syncStock(){
  const r=stockCalc();if(r.err)return r.err;
  db.penjualan.forEach(d=>{d.items.forEach((it,i)=>{it.hpp=r.hpp[d.id+':'+i]||0});jurnalFaktur('penjualan',d)});
  db.penyesuaian.forEach(a=>{a.nilai=r.adj[a.id]||0;jurnalAdj(a)});
  db.retur.forEach(x=>{x.items.forEach((it,i)=>{it.cost=r.ret[x.id+':'+i]||0});jurnalRetur(x)});
  return null;
}

/* --- faktur penjualan / pembelian --- */
const subtotalDoc=d=>d.items.reduce((t,i)=>t+i.sub,0);
const totalDoc=d=>subtotalDoc(d)-(d.diskonRp||0);
const returDocs=(t,did)=>db.retur.filter(r=>r.jenis===t&&r.fakturId===did);
const returNet=(t,d)=>returDocs(t,d.id).reduce((a,r)=>a+r.items.reduce((x,i)=>x+i.net,0),0);
const netDoc=(t,d)=>totalDoc(d)-returNet(t,d);
const paidDoc=d=>d.bayar.reduce((t,p)=>t+(p.jenis==='refund'?-p.nominal:p.nominal),0);
const sisaDoc=(t,d)=>netDoc(t,d)-paidDoc(d);
function statusDoc(t,d){const s=sisaDoc(t,d);return s<0?'lebih':s===0?'lunas':paidDoc(d)>0?'sebagian':'belum'}
function sisaAsOf(t,d,ref){
  if(d.tanggal>ref)return 0;
  const ret=returDocs(t,d.id).filter(r=>r.tanggal<=ref).reduce((a,r)=>a+r.items.reduce((x,i)=>x+i.net,0),0);
  const paid=d.bayar.filter(p=>p.tanggal<=ref).reduce((a,p)=>a+(p.jenis==='refund'?-p.nominal:p.nominal),0);
  return totalDoc(d)-ret-paid;
}
function nomorDoc(list,prefix,tanggal){
  const pre=prefix+'-'+tanggal.slice(0,7).replace('-','')+'-';let max=0;
  list.forEach(d=>{if(d.nomor&&d.nomor.startsWith(pre)){const n=parseInt(d.nomor.slice(pre.length),10);if(n>max)max=n}});
  return pre+pad3(max+1);
}
function jurnalFaktur(t,d){
  const c=CFG[t],s=db.setting,miss=missing(MOD_KEYS[t]);
  if(miss.length)throw new Error('Atur '+miss.join(', ')+' di menu Setting dulu.');
  const sub=subtotalDoc(d),dis=d.diskonRp||0,net=sub-dis;let baris;
  if(t==='penjualan'){
    baris=[{akunId:s.penjualan.piutang,debit:net,kredit:0}];
    if(dis>0){
      if(!s.penjualan.diskon||!acc(s.penjualan.diskon))throw new Error('Atur akun diskon penjualan di menu Setting dulu.');
      baris.push({akunId:s.penjualan.diskon,debit:dis,kredit:0});
    }
    baris.push({akunId:s.penjualan.pendapatan,debit:0,kredit:sub});
    const h=d.items.reduce((a,i)=>a+(i.hpp||0),0);
    if(h>0)baris.push({akunId:s.persediaan.hpp,debit:h,kredit:0},{akunId:s.persediaan.persediaan,debit:0,kredit:h});
  }else baris=[{akunId:s.persediaan.persediaan,debit:net,kredit:0},{akunId:s.pembelian.utang,debit:0,kredit:net}];
  setJurnal(d.jurnalId,{prefix:c.jp,tanggal:d.tanggal,keterangan:c.doc+' '+d.nomor+(d.pihak?' – '+d.pihak:'')+(d.ket?' ('+d.ket+')':''),sumber:t,ref:d.id,baris});
}
function jurnalBayar(t,d,p){
  const c=CFG[t],s=db.setting,lawan=t==='penjualan'?s.penjualan.piutang:s.pembelian.utang,refund=p.jenis==='refund';
  if(!lawan||!acc(lawan))throw new Error('Atur akun '+(t==='penjualan'?'piutang':'utang')+' usaha di menu Setting dulu.');
  const kasMasuk=(t==='penjualan')!==refund;
  const baris=kasMasuk
    ?[{akunId:p.akunKasId,debit:p.nominal,kredit:0},{akunId:lawan,debit:0,kredit:p.nominal}]
    :[{akunId:lawan,debit:p.nominal,kredit:0},{akunId:p.akunKasId,debit:0,kredit:p.nominal}];
  setJurnal(p.jurnalId,{prefix:c.bp,tanggal:p.tanggal,keterangan:(refund?'Refund ':'Pelunasan ')+d.nomor+(d.pihak?' – '+d.pihak:''),sumber:t,ref:d.id,payId:p.id,baris});
}
function jurnalRetur(r){
  const c=CFG[r.jenis],s=db.setting,f=db[r.jenis].find(x=>x.id===r.fakturId);
  const net=r.items.reduce((a,i)=>a+i.net,0),cost=r.items.reduce((a,i)=>a+(i.cost||0),0);let baris;
  if(r.jenis==='penjualan'){
    const miss=missing(['penjualan.piutang','penjualan.retur','persediaan.persediaan','persediaan.hpp']);
    if(miss.length)throw new Error('Atur '+miss.join(', ')+' di menu Setting dulu.');
    baris=[{akunId:s.penjualan.retur,debit:net,kredit:0},{akunId:s.penjualan.piutang,debit:0,kredit:net}];
    if(cost>0)baris.push({akunId:s.persediaan.persediaan,debit:cost,kredit:0},{akunId:s.persediaan.hpp,debit:0,kredit:cost});
  }else{
    const miss=missing(['pembelian.utang','persediaan.persediaan','persediaan.selisih']);
    if(miss.length)throw new Error('Atur '+miss.join(', ')+' di menu Setting dulu.');
    baris=[{akunId:s.pembelian.utang,debit:net,kredit:0}];
    if(cost>0)baris.push({akunId:s.persediaan.persediaan,debit:0,kredit:cost});
    const diff=net-cost;
    if(diff>0)baris.push({akunId:s.persediaan.selisih,debit:0,kredit:diff});
    else if(diff<0)baris.push({akunId:s.persediaan.selisih,debit:-diff,kredit:0});
  }
  setJurnal(r.jurnalId,{prefix:c.rj,tanggal:r.tanggal,keterangan:'Retur '+(f?f.nomor:'')+(f&&f.pihak?' – '+f.pihak:''),sumber:r.jenis,ref:r.fakturId,retId:r.id,baris});
}
function saveDoc(t,o){
  const c=CFG[t],list=db[t];
  let d=o.id&&list.find(x=>x.id===o.id);
  if(d&&returDocs(t,d.id).length)throw new Error('Faktur ini sudah punya retur. Hapus returnya dulu sebelum mengubah faktur.');
  const sub=o.items.reduce((a,i)=>a+i.sub,0),dis=Math.min(o.diskonRp||0,sub),net=sub-dis;
  if(net<=0)throw new Error('Total faktur setelah diskon harus lebih dari 0.');
  if(d&&paidDoc(d)>net)throw new Error('Total faktur tidak boleh lebih kecil dari yang sudah dibayar ('+rp(paidDoc(d))+').');
  // bagi diskon ke tiap baris secara proporsional
  const cuts=o.items.map(i=>Math.floor(dis*i.sub/sub));
  let rem=dis-cuts.reduce((a,b)=>a+b,0),big=0;o.items.forEach((i,k)=>{if(i.sub>o.items[big].sub)big=k});cuts[big]+=rem;
  const items=o.items.map((i,k)=>Object.assign({},i,{net:i.sub-cuts[k]}));
  if(!d){d={id:uid(),jurnalId:uid(),nomor:null,bayar:[]};list.push(d)}
  const pre=c.np+'-'+o.tanggal.slice(0,7).replace('-','')+'-';
  if(!d.nomor||!d.nomor.startsWith(pre)){d.nomor=null;d.nomor=nomorDoc(list,c.np,o.tanggal)}
  Object.assign(d,{tanggal:o.tanggal,jatuhTempo:o.jatuhTempo||o.tanggal,pihak:o.pihak,ket:o.ket,diskonTipe:o.diskonTipe||'rp',diskonNilai:o.diskonNilai||0,diskonRp:dis,items});
  if(t==='pembelian')jurnalFaktur(t,d);
  d.bayar.forEach(p=>jurnalBayar(t,d,p));
  return d;
}
function addBayar(t,did,p){
  const d=db[t].find(x=>x.id===did),sisa=sisaDoc(t,d);
  if(p.jenis==='refund'){if(p.nominal>Math.max(0,-sisa))throw new Error('Refund melebihi kelebihan bayar ('+rp(Math.max(0,-sisa))+').')}
  else if(p.nominal>sisa)throw new Error('Pelunasan melebihi sisa ('+rp(Math.max(0,sisa))+').');
  const rec={id:uid(),jurnalId:uid(),jenis:p.jenis||'bayar',tanggal:p.tanggal,akunKasId:p.akunKasId,nominal:p.nominal,ket:p.ket||''};
  d.bayar.push(rec);jurnalBayar(t,d,rec);
}
function delBayar(t,did,pid){
  const d=db[t].find(x=>x.id===did),p=d.bayar.find(x=>x.id===pid);
  delJurnal(p.jurnalId);d.bayar=d.bayar.filter(x=>x.id!==pid);
  if(paidDoc(d)<0)throw new Error('Hapus refund terlebih dulu sebelum menghapus pelunasan ini.');
}
function delDoc(t,id){
  const d=db[t].find(x=>x.id===id);
  if(returDocs(t,id).length)throw new Error('Faktur ini punya retur. Hapus returnya dulu.');
  delJurnal(d.jurnalId);d.bayar.forEach(p=>delJurnal(p.jurnalId));
  db[t]=db[t].filter(x=>x.id!==id);
}
function saveRetur(t,o){
  const c=CFG[t],f=db[t].find(x=>x.id===o.fakturId);
  if(o.tanggal<f.tanggal)throw new Error('Tanggal retur tidak boleh sebelum tanggal faktur ('+fmtDate(f.tanggal)+').');
  const done={},doneNet={};
  returDocs(t,f.id).forEach(r=>r.items.forEach(i=>{done[i.idx]=(done[i.idx]||0)+i.qty;doneNet[i.idx]=(doneNet[i.idx]||0)+i.net}));
  const items=o.items.map(x=>{
    const it=f.items[x.idx],before=done[x.idx]||0;
    if(x.qty+before>it.qty+1e-9)throw new Error('Jumlah retur '+barangNama(it.barangId)+' melebihi jumlah di faktur.');
    const habis=Math.abs(x.qty+before-it.qty)<1e-9;
    const net=habis?itemNet(it)-(doneNet[x.idx]||0):Math.round(itemNet(it)*x.qty/it.qty);
    return {idx:x.idx,barangId:it.barangId,qty:x.qty,harga:it.harga,sub:Math.round(x.qty*it.harga),net};
  });

  return r;

function tutupBuku(year){
  const la=db.setting.tutup&&db.setting.tutup.labaDitahan;
  if(!la||!acc(la))throw new Error('Atur akun laba ditahan di menu Setting (tab Tutup buku) dulu.');
  if(db.tutupBuku[year])throw new Error('Tahun '+year+' sudah ditutup.');
  const ys=year+'-01-01',ye=year+'-12-31',dk={};
  db.jurnal.forEach(j=>{
    if(j.tanggal<ys||j.tanggal>ye||j.sumber==='penutup')return;
    j.baris.forEach(b=>{const a=acc(b.akunId);if(a&&isPL(a))dk[a.id]=(dk[a.id]||0)+b.debit-b.kredit});
  });
  const baris=[];let tot=0;
  Object.keys(dk).forEach(id=>{const x=dk[id];if(!x)return;tot+=x;baris.push(x>0?{akunId:id,debit:0,kredit:x}:{akunId:id,debit:-x,kredit:0})});
  if(!baris.length)throw new Error('Belum ada transaksi laba rugi di tahun '+year+'.');
  if(tot<0)baris.push({akunId:la,debit:0,kredit:-tot});
  else if(tot>0)baris.push({akunId:la,debit:tot,kredit:0});
  const jid=uid();
  setJurnal(jid,{prefix:'TB',tanggal:ye,keterangan:'Jurnal penutup tahun '+year,sumber:'penutup',ref:null,baris});
  db.tutupBuku[year]={jurnalId:jid,waktu:Date.now()};
  for(let m=1;m<=12;m++)db.kunci[year+'-'+pad(m)]=true;
}
function batalTutupBuku(year){
  const tb=db.tutupBuku[year];if(!tb)return;
  delJurnal(tb.jurnalId);delete db.tutupBuku[year];
  for(let m=1;m<=12;m++)delete db.kunci[year+'-'+pad(m)];
}

/* ============ Perhitungan saldo ============ */
const isPL=a=>['pendapatan','hpp','beban'].includes(tipeOf(a));
function saldoMap(periode){
  const start=periode+'-01',ys=periode.slice(0,4)+'-01-01',m={};
  leafs().forEach(a=>{m[a.id]={a,sa:a.saldoAwal||0,pd:0,pk:0,lrd:0,lrk:0,bd:0,bk:0,pl:isPL(a)}});
  db.jurnal.forEach(j=>j.baris.forEach(b=>{
    const r=m[b.akunId];if(!r)return;
    const t=j.tanggal;
    if(t<start){if(r.pl&&t<ys)return;r.bd+=b.debit;r.bk+=b.kredit}
    else if(t.startsWith(periode)){r.pd+=b.debit;r.pk+=b.kredit;if(j.sumber!=='penutup'){r.lrd+=b.debit;r.lrk+=b.kredit}}
  }));
  Object.values(m).forEach(r=>{
    r.s=normalOf(r.a)==='D'?1:-1;
    r.awal=(r.pl?0:r.sa)+r.s*(r.bd-r.bk);   // akun laba rugi mulai dari 0 tiap 1 Januari
    r.akhir=r.awal+r.s*(r.pd-r.pk);
  });
  return m;
}
// laba (positif) atau rugi (negatif) tahun-tahun sebelum 'year' yang belum dipindah ke laba ditahan
function priorProfit(year){
  const ys=year+'-01-01';let dk=0;
  leafs().filter(isPL).forEach(a=>{dk+=(normalOf(a)==='D'?1:-1)*(a.saldoAwal||0)});
  db.jurnal.forEach(j=>{if(j.tanggal>=ys)return;j.baris.forEach(b=>{const a=acc(b.akunId);if(a&&a.level===3&&isPL(a))dk+=b.debit-b.kredit})});
  return -dk;
}
function ledger(accId,from,to){
  const a=acc(accId),s=normalOf(a)==='D'?1:-1,pl=isPL(a),ys=from?from.slice(0,4)+'-01-01':null;
  const ent=[];
  db.jurnal.forEach((j,i)=>j.baris.forEach(b=>{if(b.akunId===accId)ent.push({j,b,i})}));
  ent.sort((x,y)=>x.j.tanggal<y.j.tanggal?-1:x.j.tanggal>y.j.tanggal?1:x.i-y.i);
  let saldo=(pl&&from)?0:(a.saldoAwal||0);const rows=[];let awal=null;
  ent.forEach(e=>{
    if(from&&e.j.tanggal<from){if(pl&&e.j.tanggal<ys)return;saldo+=s*(e.b.debit-e.b.kredit);return}
    if(awal===null)awal=saldo;
    if(to&&e.j.tanggal>to)return;
    saldo+=s*(e.b.debit-e.b.kredit);
    rows.push({tgl:e.j.tanggal,nomor:e.j.nomor,ket:e.j.keterangan,debit:e.b.debit,kredit:e.b.kredit,saldo});
  });
  if(awal===null)awal=saldo;
  return {awal,rows,akhir:rows.length?rows[rows.length-1].saldo:awal,normal:s===1?'D':'K'};
}

const yearsList=()=>{const s=new Set([curP().slice(0,4),String(ui.tahun)]);db.jurnal.forEach(j=>s.add(j.tanggal.slice(0,4)));Object.keys(db.tutupBuku).forEach(y=>s.add(y));return [...s].sort()};

function labaTahun(Y){
  let dk=0;
  db.jurnal.forEach(j=>{if(j.sumber==='penutup'||j.tanggal<Y+'-01-01'||j.tanggal>Y+'-12-31')return;

function repLR(){

function repNeraca(){
  const Y=String(ui.tahun),end=Y+'-12-31',ys=Y+'-01-01';
  const bal={};leafs().filter(a=>!isPL(a)).forEach(a=>{bal[a.id]=(normalOf(a)==='D'?1:-1)*(a.saldoAwal||0)});
  let cur=0;
  db.jurnal.forEach(j=>{if(j.tanggal>end)return;j.baris.forEach(b=>{
    if(bal[b.akunId]!==undefined)bal[b.akunId]+=b.debit-b.kredit;
    else if(j.tanggal>=ys){const a=acc(b.akunId);if(a&&a.level===3&&isPL(a))cur+=b.debit-b.kredit}})});
  const labaBerjalan=-cur,labaLalu=priorProfit(+Y);
  const sec=(tipe,sign)=>{
    let tot=0,html='';
    db.coa.filter(a=>a.level===1&&a.tipe===tipe).forEach(h=>{
      html+=`<tr class="lv1"><td class="kode">${esc(h.kode)}</td><td>${esc(h.nama)}</td><td class="num"></td></tr>`;
      db.coa.filter(a=>a.level===2&&a.kode.startsWith(h.kode+'-')).forEach(sh=>{
        const items=leafs().filter(a=>a.kode.startsWith(sh.kode+'-')&&bal[a.id]).map(a=>({a,v:sign*bal[a.id]}));
        if(!items.length)return;
        const sub=items.reduce((s,x)=>s+x.v,0);tot+=sub;
        html+=`<tr class="lv2"><td class="kode">${esc(sh.kode)}</td><td class="nm">${esc(sh.nama)}</td><td class="num">${fmt(sub)}</td></tr>`+
          items.map(x=>`<tr class="lv3"><td class="kode">${esc(x.a.kode)}</td><td class="nm">${esc(x.a.nama)}</td><td class="num">${fmt(x.v)}</td></tr>`).join('');
      });

    return {html,tot};

  const extra=(labaLalu?`<tr class="lv3"><td class="kode"></td><td class="nm">Laba tahun lalu (belum ditutup, otomatis)</td><td class="num">${fmt(labaLalu)}</td></tr>`:'')+
              (labaBerjalan?`<tr class="lv3"><td class="kode"></td><td class="nm">Laba tahun berjalan (otomatis)</td><td class="num">${fmt(labaBerjalan)}</td></tr>`:'');
  const totE=E.tot+labaLalu+labaBerjalan,totKE=K.tot+totE;
  return `<div class="bar">${yearSelect()}<span class="grow dim">Posisi per 31 Desember ${Y}</span>${A.tot===totKE?'<span class="chip ok">Seimbang</span>':`<span class="chip bad">Selisih ${rp(A.tot-totKE)}</span>`}</div>

    ${E.html}${extra}<tr class="tot"><td></td><td>Total ekuitas</td><td class="num">${fmt(totE)}</td></tr>
    <tr class="tot"><td></td><td>Total kewajiban dan ekuitas</td><td class="num">${fmt(totKE)}</td></tr>
  </tbody></table></div></section>`;

function repArus(){
  const p=ui.periode,m=saldoMap(p),s=db.setting;
  const kasIds=new Set(leafs().filter(a=>a.kas).map(a=>a.id));
  const cat=a=>{const t=tipeOf(a);
    if(t==='pendapatan'||t==='hpp'||t==='beban')return 'op';
    if(t==='aset')return(a.id===(s.penjualan||{}).piutang||a.id===(s.persediaan||{}).persediaan)?'op':'inv';
    if(t==='kewajiban')return a.id===(s.pembelian||{}).utang?'op':'fin';
    return 'fin'};
  const sums={op:{},inv:{},fin:{}};
  db.jurnal.forEach(j=>{
    if(!j.tanggal.startsWith(p)||!j.baris.some(b=>kasIds.has(b.akunId)))return;
    j.baris.forEach(b=>{if(kasIds.has(b.akunId))return;const a=acc(b.akunId);if(!a)return;const v=b.kredit-b.debit;if(!v)return;
      const c=cat(a);sums[c][a.id]=(sums[c][a.id]||0)+v});
  });
  const rowsOf=c=>Object.keys(sums[c]).map(id=>({a:acc(id),v:sums[c][id]})).filter(x=>x.v).sort((x,y)=>cmpKode(x.a.kode,y.a.kode));
  const tot=c=>rowsOf(c).reduce((t,x)=>t+x.v,0);
  const sec=(c,label)=>{const r=rowsOf(c);
    return `<tr class="lv1"><td colspan="2">${label}</td><td class="num">${fmt(tot(c))}</td></tr>`+
      (r.length?r.map(x=>`<tr><td class="kode">${esc(x.a.kode)}</td><td style="padding-left:28px">${esc(x.a.nama)}</td><td class="num ${x.v<0?'neg':''}">${fmt(x.v)}</td></tr>`).join(''):`<tr><td></td><td class="dim" style="padding-left:28px">Tidak ada</td><td></td></tr>`)};
  const net=tot('op')+tot('inv')+tot('fin');
  const kasAwal=Object.values(m).filter(r=>r.a.kas).reduce((t,r)=>t+r.awal,0),kasAkhir=Object.values(m).filter(r=>r.a.kas).reduce((t,r)=>t+r.akhir,0);
  return `<div class="bar"><span class="grow dim">Arus kas ${perLabel(p)} (metode langsung, dari jurnal yang menyentuh akun kas dan bank). Transfer antar kas tidak dihitung.</span>
    ${kasAwal+net===kasAkhir?'<span class="chip ok">Cocok dengan saldo kas</span>':`<span class="chip bad">Selisih ${rp(kasAkhir-kasAwal-net)}</span>`}</div>
  <section class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kode</th><th>Keterangan</th><th class="num">Jumlah</th></tr></thead><tbody>
    ${sec('op','Arus kas dari operasional')}${sec('inv','Arus kas dari investasi')}${sec('fin','Arus kas dari pendanaan')}
    <tr class="tot"><td></td><td>Kenaikan (penurunan) kas</td><td class="num">${fmt(net)}</td></tr>
    <tr class="sub"><td></td><td>Saldo kas awal</td><td class="num">${fmt(kasAwal)}</td></tr>
    <tr class="tot"><td></td><td>Saldo kas akhir</td><td class="num">${fmt(kasAkhir)}</td></tr>
  </tbody></table></div></section>`;
}

function repUmur(t){
  const c=CFG[t],ref=ui.periode<curP()?lastDayOf(ui.periode):today();
  const groups={};
  db[t].forEach(d=>{const s=sisaAsOf(t,d,ref);if(s<=0)return;
    const late=daysBetween(d.jatuhTempo||d.tanggal,ref),b=late<=0?0:late<=30?1:late<=60?2:3;
    const key=d.pihak||'(tanpa nama)';(groups[key]=groups[key]||[]).push({d,s,b,late})});
  const names=Object.keys(groups).sort();
  const cells=arr=>arr.map(v=>`<td class="num">${fmt(v)}</td>`).join('')+`<td class="num"><b>${fmt(arr.reduce((a,b)=>a+b,0))}</b></td>`;
  const bucket=(items,withJ)=>{const a=[0,0,0,0];items.forEach(x=>{a[x.b]+=x.s});return a};
  const grand=[0,0,0,0];
  const body=names.map(n=>{
    const items=groups[n].sort((x,y)=>(x.d.jatuhTempo||x.d.tanggal)<(y.d.jatuhTempo||y.d.tanggal)?-1:1),bs=bucket(items);
    bs.forEach((v,i)=>grand[i]+=v);
    return `<tr class="lv2"><td colspan="2">${esc(n)}</td>${cells(bs)}</tr>`+items.map(x=>{const a=[0,0,0,0];a[x.b]=x.s;
      return `<tr><td class="nm" style="padding-left:24px">${esc(x.d.nomor)}</td><td class="dim" style="white-space:nowrap">${fmtDate(x.d.jatuhTempo||x.d.tanggal)}${x.late>0?' · '+x.late+' hari':''}</td>${cells(a)}</tr>`}).join('')}).join('');
  return `<div class="bar"><span class="grow dim">Umur ${c.sisa.toLowerCase()} per ${fmtDate(ref)}, dihitung dari tanggal jatuh tempo. Periode lalu memakai akhir bulan, periode berjalan memakai hari ini.</span></div>
  <section class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${c.pihak} / faktur</th><th>Jatuh tempo</th><th class="num">Belum jatuh tempo</th><th class="num">Terlambat 1-30</th><th class="num">31-60</th><th class="num">Lebih dari 60</th><th class="num">Total</th></tr></thead><tbody>
  ${body||`<tr><td colspan="7" class="empty">Tidak ada ${c.sisa.toLowerCase()} yang belum lunas.</td></tr>`}
  </tbody>${names.length?`<tfoot><tr><td colspan="2">Total</td>${cells(grand)}</tr></tfoot>`:''}</table></div></section>`;
}

/* ============ Cloud sync (Firebase Firestore) ============ */
const FB_VER='10.14.1';   // ganti jika proyek Firebase lain memakai versi berbeda
const FB_CONFIG={
  apiKey:"AIzaSyDd5MiYS92RIfA5TV25asceMrhnydiJkbA",
  authDomain:"mandarin-8927e.firebaseapp.com",
  projectId:"mandarin-8927e",
  storageBucket:"mandarin-8927e.firebasestorage.app",
  messagingSenderId:"858133578177",
  appId:"1:858133578177:web:bd03b2d075d2bab8902f40"
};
const COLL='akuntansiApp';            // satu-satunya koleksi yang dipakai aplikasi ini
const KODE_RE=/^[a-z0-9_-]{1,20}$/;
const MAX_BYTES=900000;               // batas dokumen Firestore 1 MiB, sisakan ruang aman
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const getKode=()=>lsGet('akuntansi:kode')||'';
const lastSync=k=>{const v=lsGet('akuntansi:sync:'+k);return v?+v:null};
const tglJam=ts=>new Date(ts).toLocaleString('id-ID');
const dataBytes=()=>new TextEncoder().encode(JSON.stringify(db)).length;
let fbCache=null;
async function fb(){
  if(fbCache)return fbCache;
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  const [appM,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js')]);
  const app=appM.getApps().find(a=>a.name==='akuntansi')||appM.initializeApp(FB_CONFIG,'akuntansi');
  fbCache={fs,store:fs.getFirestore(app)};
  return fbCache;
}
const errText=e=>(e&&e.message?e.message:String(e))+(e&&e.code?' ('+e.code+')':'');
const syncMsgHtml=()=>ui.syncMsg?`<p class="${ui.syncMsg.kind==='err'?'neg':ui.syncMsg.kind==='ok'?'pos':'dim'}" style="margin:10px 0 0;overflow-wrap:anywhere">${esc(ui.syncMsg.text)}</p>`:'';
function syncMsg(text,kind){ui.syncMsg=text?{text,kind}:null;const el=$('#syncMsg');if(el)el.innerHTML=syncMsgHtml()}
function syncInfoText(){
  const k=getKode(),ls=k&&KODE_RE.test(k)?lastSync(k):null;
  return 'Terakhir sinkron di perangkat ini: '+(ls?tglJam(ls):'belum pernah')+'. Ukuran data: '+Math.ceil(dataBytes()/1024)+' KB dari batas sekitar 1.000 KB.';
}
const updateSyncInfo=()=>{const el=$('#syncInfo');if(el)el.textContent=syncInfoText()};
const syncBusy=on=>document.querySelectorAll('[data-act^="cloud-"]').forEach(b=>{b.disabled=on});
function cekKode(){
  const k=getKode();
  if(!KODE_RE.test(k)){syncMsg('Isi kode sync dulu: huruf kecil, angka, - atau _, maksimal 20 karakter.','err');return null}
  return k;
}
async function cloudSave(){
  const kode=cekKode();if(!kode)return;
  const data=JSON.parse(JSON.stringify(db));           // buang undefined
  const bytes=new TextEncoder().encode(JSON.stringify(data)).length;
  if(bytes>MAX_BYTES){syncMsg('Data terlalu besar untuk satu dokumen Firestore ('+Math.round(bytes/1024)+' KB, batas sekitar 1.000 KB). Gunakan ekspor file JSON.','err');return}
  syncBusy(true);syncMsg('Menghubungi cloud…','info');
  try{
    const {fs,store}=await fb();
    const ref=fs.doc(store,COLL,kode);
    const snap=await fs.getDoc(ref);
    if(snap.exists()){
      const remote=snap.data().updatedAt,mine=lastSync(kode);
      if(remote!==mine&&!confirm('Di cloud sudah ada data dengan kode "'+kode+'"'+(remote?' (disimpan '+tglJam(remote)+')':'')+' yang berbeda dari sinkron terakhir perangkat ini. Timpa dengan data di perangkat ini?')){
        syncMsg('Simpan dibatalkan. Data di cloud tidak diubah.','info');return}
    }
    const updatedAt=Date.now();
    await fs.setDoc(ref,{data,updatedAt});
    lsSet('akuntansi:sync:'+kode,String(updatedAt));
    syncMsg('Tersimpan ke cloud pada '+tglJam(updatedAt)+'.','ok');updateSyncInfo();
  }catch(e){syncMsg(errText(e),'err')}
  finally{syncBusy(false)}
}
async function cloudLoad(){
  const kode=cekKode();if(!kode)return;
  syncBusy(true);syncMsg('Mengambil dari cloud…','info');
  try{
    const {fs,store}=await fb();
    const snap=await fs.getDoc(fs.doc(store,COLL,kode));
    if(!snap.exists()){syncMsg('Tidak ada data dengan kode "'+kode+'" di cloud.','err');return}
    const r=snap.data(),d=r&&r.data;
    if(!d||!Array.isArray(d.coa)||!Array.isArray(d.jurnal)||!Array.isArray(d.kas)){syncMsg('Isi dokumen cloud bukan data Akuntansi yang valid.','err');return}
    if(!confirm('Ganti seluruh data di perangkat ini dengan data dari cloud'+(r.updatedAt?' (disimpan '+tglJam(r.updatedAt)+')':'')+'?')){syncMsg('Ambil dibatalkan. Data di perangkat ini tidak diubah.','info');return}
    db=migrate(d);sortCoa();persist();
    if(r.updatedAt)lsSet('akuntansi:sync:'+kode,String(r.updatedAt));
    syncMsg('Data berhasil diambil dari cloud.','ok');render();
  }catch(e){syncMsg(errText(e),'err')}
  finally{syncBusy(false)}
}

  openDlg(`<form novalidate><h2>${edit?'Ubah':'Tambah'} ${name}</h2>
    <p class="hint">${parent?'Di bawah '+esc(parent.kode+' '+parent.nama):'Kelompok paling atas'}</p>

      ${kids?'<div class="sub">Kode dikunci karena masih punya akun di bawahnya.</div>':''}</div>
    <div class="field"><label for="f-nama">Nama</label><input type="text" id="f-nama" value="${esc(edit?a.nama:'')}" autocomplete="off"></div></div>
    ${level===1?`<div class="field"><label for="f-tipe">Jenis</label><select id="f-tipe">${Object.entries(TIPE).map(([k,v])=>`<option value="${k}"${edit&&a.tipe===k?' selected':''}>${v}</option>`).join('')}</select>
      <div class="sub">Menentukan sisi normal (debit atau kredit) dan posisi di laporan.</div></div>`:''}
    ${level===3?`<div class="field"><label for="f-sa">Saldo awal (Rp)</label><input type="text" id="f-sa" class="rp" inputmode="numeric" value="${edit&&a.saldoAwal?num(a.saldoAwal):''}" placeholder="0"></div>
      <div class="field check"><input type="checkbox" id="f-kas"${edit&&a.kas?' checked':''}><label for="f-kas" style="margin:0">Akun kas atau bank (muncul di Jurnal kas)</label></div>
      <div class="field"><label for="f-normal">Sisi normal saldo</label><select id="f-normal"><option value="">Ikuti jenis head</option><option value="D"${edit&&a.normal==='D'?' selected':''}>Debit</option><option value="K"${edit&&a.normal==='K'?' selected':''}>Kredit</option></select><div class="sub">Ubah hanya untuk akun pengurang, misalnya Diskon Penjualan di bawah Pendapatan.</div></div>`:''}
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Batal</button><button type="submit" class="btn primary">Simpan</button></div></form>`);
  dlg.querySelector('form').onsubmit=e=>{

    const re=level===1?/^\d+$/:new RegExp('^'+escRe(parent.kode)+'-\\d+$');
    if(!nama)return setErr('Nama akun wajib diisi.');
    if(!re.test(kode))return setErr(level===1?'Kode head berupa angka, contoh 1.':'Kode harus diawali '+parent.kode+'-, contoh '+nextKode(level,parent)+'.');
    if(db.coa.some(x=>x.kode===kode&&(!edit||x.id!==a.id)))return setErr('Kode '+kode+' sudah dipakai.');
    if(!confirm((edit?'Simpan perubahan akun ':'Tambah akun ')+kode+' '+nama+'?'))return;
    const rec=edit?a:{id:uid(),level,saldoAwal:0};
    rec.kode=kode;rec.nama=nama;
    if(level===1)rec.tipe=val('f-tipe');
    if(level===3){rec.saldoAwal=parseRp(val('f-sa'));rec.kas=dlg.querySelector('#f-kas').checked;const nv=val('f-normal');if(nv)rec.normal=nv;else delete rec.normal}
    if(!edit)db.coa.push(rec);
    sortCoa();closeDlg();commit();toast('Akun '+kode+' tersimpan.');
  };
}
function delCoa(id){
  const a=acc(id);

}

function rtTotals(){
  let tot=0;
  dlg.querySelectorAll('#rt-body tr').forEach(tr=>{
    const q=parseQty(tr.querySelector('.rt-q').value),v=Math.round(+tr.dataset.net*Math.min(q,+tr.dataset.max)/(+tr.dataset.qty));
    tr.querySelector('.rt-v').textContent=q?num(v):'–';tot+=q?v:0;
  });
  const net0=+dlg.dataset.net0,paid=+dlg.dataset.paid,lebih=Math.max(0,paid-(net0-tot));
  dlg.dataset.lebih=lebih;
  const a=dlg.querySelector('#rt-total'),b=dlg.querySelector('#rt-lebih');
  if(a)a.textContent=num(tot);if(b)b.textContent=num(lebih);
}
function dlgRetur(t,id){
  const c=CFG[t],f=db[t].find(x=>x.id===id);if(!f)return;
  const need=t==='penjualan'?['penjualan.piutang','penjualan.retur','persediaan.persediaan','persediaan.hpp']:['pembelian.utang','persediaan.persediaan','persediaan.selisih'];
  const miss=missing(need);
  if(miss.length)return toast('Atur '+miss.join(', ')+' di menu Setting dulu.');
  const done={};returDocs(t,id).forEach(r=>r.items.forEach(i=>{done[i.idx]=(done[i.idx]||0)+i.qty}));
  const rows=f.items.map((it,i)=>({it,i,sisa:r3(it.qty-(done[i]||0))}));
  if(!rows.some(r=>r.sisa>0))return toast('Semua barang di faktur ini sudah diretur.');
  dlg.dataset.net0=netDoc(t,f);dlg.dataset.paid=paidDoc(f);dlg.dataset.lebih=0;
  const tgl0=defaultDate()<f.tanggal?f.tanggal:defaultDate();
  openDlg(`<form novalidate><h2>Retur ${t==='penjualan'?'penjualan':'pembelian'}</h2>
    <p class="hint">${c.doc} ${esc(f.nomor)} · ${esc(f.pihak||'–')}. ${t==='penjualan'?'Stok kembali ke harga pokok saat dijual dan piutang berkurang.':'Stok keluar dengan harga rata-rata dan utang berkurang; selisih harga masuk ke akun selisih persediaan.'}</p>
    <div class="row2"><div class="field"><label for="rt-tgl">Tanggal retur</label><input type="date" id="rt-tgl" value="${tgl0}"></div>
    <div class="field"><label for="rt-ket">Alasan (opsional)</label><input type="text" id="rt-ket" autocomplete="off"></div></div>
    <div class="tbl-wrap"><table class="jr-tbl" style="width:100%;min-width:480px"><thead><tr><th style="text-align:left">Barang</th><th style="text-align:right">Di faktur</th><th style="text-align:right">Bisa diretur</th><th style="text-align:right">Jumlah retur</th><th style="text-align:right">Nilai</th></tr></thead><tbody id="rt-body">`+
    rows.map(r=>`<tr data-i="${r.i}" data-max="${r.sisa}" data-qty="${r.it.qty}" data-net="${itemNet(r.it)}"><td>${esc(barangNama(r.it.barangId))}</td><td class="num">${r.it.qty}</td><td class="num">${r.sisa}</td><td style="width:100px"><input type="text" class="rt-q" inputmode="decimal" aria-label="Jumlah retur" ${r.sisa<=0?'disabled':''}></td><td class="num rt-v" style="width:110px">–</td></tr>`).join('')+
    `</tbody></table></div>
    <div class="pay-sum" style="margin-top:10px;justify-content:flex-end"><span>Nilai retur<b>Rp <span id="rt-total">0</span></b></span><span>Kelebihan bayar setelah retur<b>Rp <span id="rt-lebih">0</span></b></span></div>
    <div class="row2"><div class="field"><label for="rt-rn">Refund lewat kas (Rp, opsional)</label><input type="text" id="rt-rn" class="rp" inputmode="numeric" placeholder="0"><div class="sub"><button type="button" class="lnk" data-act="rt-full" style="padding-left:0">Isi sesuai kelebihan bayar</button> Kosongkan jika kelebihan dibiarkan sebagai saldo.</div></div>
    <div class="field"><label for="rt-rk">Akun kas atau bank</label><select id="rt-rk">${accOptions(null,a=>a.kas)}</select></div></div>
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="dlg-close">Batal</button><button type="submit" class="btn primary">Simpan retur</button></div></form>`,true);
  dlg.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    const tanggal=val('rt-tgl'),items=[];let bad=null;
    if(!tanggal)return setErr('Tanggal wajib diisi.');
    if(tanggal<f.tanggal)return setErr('Tanggal retur tidak boleh sebelum tanggal faktur.');
    dlg.querySelectorAll('#rt-body tr').forEach(tr=>{
      const q=parseQty(tr.querySelector('.rt-q').value);if(!q)return;
      if(q>+tr.dataset.max+1e-9)bad='Jumlah retur melebihi yang bisa diretur.';
      items.push({idx:+tr.dataset.i,qty:q});
    });
    if(bad)return setErr(bad);
    if(!items.length)return setErr('Isi jumlah retur minimal satu barang.');
    rtTotals();
    const rn=parseRp(val('rt-rn')),rk=val('rt-rk'),lebih=+dlg.dataset.lebih;
    if(rn>lebih)return setErr('Refund melebihi kelebihan bayar (Rp '+num(lebih)+').');
    if(rn>0&&!rk)return setErr('Pilih akun kas atau bank untuk refund.');
    const total=+dlg.querySelector('#rt-total').textContent.replace(/\./g,'');
    if(!confirm('Buat retur '+t+' senilai '+rp(total)+' dari '+f.nomor+(rn>0?', refund '+rp(rn):'')+' tanggal '+fmtDate(tanggal)+'?'))return;
    const err=tryChange(()=>saveRetur(t,{fakturId:id,tanggal,ket:val('rt-ket').trim(),items,refund:rn>0?{nominal:rn,akunKasId:rk}:null}));
    if(err)return setErr(err);
    ui[t+'Tab']=ui[t+'Tab']||'faktur';render();dlgBayar(t,id);toast('Retur tersimpan.');
  };
}

/* --- Ekspor / impor --- */
function doExport(){
  db.terakhirEkspor=new Date().toISOString();persist();
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='akuntansi-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  render();toast('File cadangan diunduh.');
}
function doImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d||!Array.isArray(d.coa)||!Array.isArray(d.jurnal)||!Array.isArray(d.kas))throw new Error('format');
      if(!confirm('Ganti seluruh data saat ini dengan isi file ini?'))return;
      db=migrate(d);sortCoa();commit();toast('Data berhasil diimpor.');
    }catch(e){toast('File tidak valid. Pilih file JSON hasil ekspor Akuntansi.')}
  };
  fr.readAsText(file);
}

/* ============ Event ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='go')e.preventDefault();
  switch(a){
    case 'go':go(id);break;
    case 'menu':$('#side').classList.add('open');$('#scrim').classList.add('open');break;
    case 'side-close':closeSide();break;
    case 'per-prev':ui.periode=shiftP(ui.periode,-1);render();break;
    case 'per-next':ui.periode=shiftP(ui.periode,1);render();break;
    case 'tab':ui[t.dataset.k]=t.dataset.v;render();break;
    case 'dlg-close':closeDlg();break;
    case 'coa-add-head':dlgCoa({level:1});break;
    case 'coa-add-sub':dlgCoa({level:2,parentId:id});break;
    case 'coa-add-akun':dlgCoa({level:3,parentId:id});break;
    case 'coa-edit':dlgCoa({id});break;
    case 'coa-del':delCoa(id);break;
    case 'kas-add':dlgKas({jenis:id});break;
    case 'kas-edit':ui.kasTab='kas';dlgKas({id});break;
    case 'kas-del':delKas(id);break;
    case 'jurnal-add':dlgJurnal();break;
    case 'jurnal-edit':dlgJurnal(id);break;
    case 'jurnal-del':if(confirm('Hapus jurnal ini?')){const err=tryChange(()=>{db.jurnal=db.jurnal.filter(j=>j.id!==id)});if(err)toast(err);else{render();toast('Jurnal dihapus.')}}break;
    case 'jr-add':{const tb=dlg.querySelector('#jr-body');tb.insertAdjacentHTML('beforeend',jrRow());break}
    case 'jr-rm':{const tb=dlg.querySelector('#jr-body');if(tb.rows.length>2){t.closest('tr').remove();jrTotals()}break}
    case 'doc-add':dlgDoc(t.dataset.t);break;
    case 'doc-edit':dlgDoc(t.dataset.t,id);break;
    case 'doc-open':dlgBayar(t.dataset.t,id);break;
    case 'doc-del':{const T=t.dataset.t,d=db[T].find(x=>x.id===id);
      if(d&&confirm('Hapus '+d.nomor+'? Jurnal dan pelunasannya ikut terhapus.')){const err=tryChange(()=>delDoc(T,id));if(err)toast(err);else{render();toast('Faktur dihapus.')}}break}
    case 'di-add':dlg.querySelector('#di-body').insertAdjacentHTML('beforeend',dlg.dataset.row);break;
    case 'di-rm':{const tb=dlg.querySelector('#di-body');if(tb.rows.length>1){t.closest('tr').remove();diTotals()}break}
    case 'pay-del':if(confirm('Hapus pelunasan ini?')){const T=t.dataset.t,err=tryChange(()=>delBayar(T,id,t.dataset.p));if(err)toast(err);else{render();dlgBayar(T,id);toast('Pelunasan dihapus.')}}break;
    case 'pay-full':dlg.querySelector('#p-nom').value=num(+t.dataset.sisa);break;
    case 'barang-add':dlgBarang();break;
    case 'barang-edit':dlgBarang(id);break;
    case 'barang-del':if(confirm('Hapus barang ini?')){const err=tryChange(()=>delBarang(id));if(err)toast(err);else{render();toast('Barang dihapus.')}}break;
    case 'adj-add':dlgAdj();break;
    case 'adj-del':if(confirm('Hapus penyesuaian ini?')){const err=tryChange(()=>delAdj(id));if(err)toast(err);else{render();toast('Penyesuaian dihapus.')}}break;
    case 'go-stok':ui.stokTab='adj';go('persediaan');break;
    case 'cloud-save':cloudSave();break;
    case 'cloud-load':cloudLoad();break;
    case 'retur-add':dlgRetur(t.dataset.t,id);break;
    case 'retur-del':{const T=t.dataset.t,r=db.retur.find(x=>x.id===id);
      if(r&&confirm('Hapus retur '+r.nomor+'? Jurnalnya ikut terhapus.')){const err=tryChange(()=>delRetur(id));
        if(err)toast(err);else{render();if(t.dataset.back)dlgBayar(T,t.dataset.back);toast('Retur dihapus.')}}break}
    case 'rt-full':dlg.querySelector('#rt-rn').value=num(+dlg.dataset.lebih);break;
    case 'kunci':{const p=t.dataset.p,lk=!!db.kunci[p];
      if(confirm(lk?'Buka kunci periode '+perLabel(p)+'? Transaksi di bulan itu bisa diubah lagi.':'Kunci periode '+perLabel(p)+'? Transaksi di bulan itu tidak bisa ditambah, diubah, atau dihapus.')){
        if(lk)delete db.kunci[p];else db.kunci[p]=true;persist();render();toast(lk?'Periode dibuka.':'Periode dikunci.')}break}
    case 'tutup-buku':{const y=t.dataset.y;
      if(confirm('Tutup buku tahun '+y+'? Dibuat jurnal penutup tanggal 31 Desember '+y+' dan semua bulan di '+y+' dikunci.')){
        const snap=JSON.stringify(db);try{tutupBuku(y);persist();render();toast('Tutup buku '+y+' selesai.')}catch(x){db=JSON.parse(snap);toast(x.message)}}break}
    case 'batal-tutup':{const y=t.dataset.y;
      if(confirm('Batalkan tutup buku tahun '+y+'? Jurnal penutup dihapus dan semua bulan di '+y+' dibuka kuncinya.')){batalTutupBuku(y);persist();render();toast('Tutup buku '+y+' dibatalkan.')}break}
    case 'export':doExport();break;
    case 'import':$('#file').click();break;
    case 'reset-trx':if(confirm('Hapus semua transaksi? Daftar akun, saldo awal, barang, dan setting tetap ada.')){db.jurnal=[];db.kas=[];db.penjualan=[];db.pembelian=[];db.retur=[];db.penyesuaian=[];db.kunci={};db.tutupBuku={};commit();toast('Semua transaksi dihapus.')}break;
    case 'reset-sample':if(confirm('Ganti semua data dengan data awal? Semua transaksi dan saldo awal akan dihapus.')){resetSample();render();toast('Data awal dimuat.')}break;
  }
});

  if(t.closest&&t.closest('#di-body'))diTotals();
  if(t.id==='d-dn'){const tp=dlg.querySelector('#d-dt');if(tp&&tp.value==='rp'){const v=parseRp(t.value);t.value=v?num(v):''}diTotals()}
  if(t.classList&&t.classList.contains('rt-q'))rtTotals();
  if(t.id==='coaQ'){ui.coaQ=t.value;const pos=t.selectionStart;render();const n=$('#coaQ');n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==='kode'){const v=t.value.toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,20);if(v!==t.value)t.value=v;lsSet('akuntansi:kode',v);updateSyncInfo()}
  if(t.id==='co'){db.perusahaan=t.value.trim()||'Nama Perusahaan';persist();$('#brandCo').textContent=db.perusahaan}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='periode'&&/^\d{4}-\d{2}$/.test(t.value)){ui.periode=t.value;render()}
  if(t.classList&&t.classList.contains('di-b')){
    const h=t.closest('tr').querySelector('.di-h'),hj=t.selectedOptions[0]&&t.selectedOptions[0].dataset.hj;
    if(dlg.dataset.t==='penjualan'&&hj&&+hj>0&&!parseRp(h.value))h.value=num(+hj);
    diTotals();
  }
  if(t.id==='d-dt'){const dn=dlg.querySelector('#d-dn');if(dn)dn.value='';diTotals()}
  if(t.dataset&&t.dataset.setnum){const [a,b]=t.dataset.setnum.split('.'),v=Math.max(0,Math.min(365,parseInt(t.value,10)||0));
    if(!confirm('Ubah jatuh tempo '+a+' menjadi '+v+' hari?')){render();return}
    db.setting[a][b]=v;persist();render();toast('Pengaturan tersimpan.');return}
  if(t.dataset&&t.dataset.set){const [a,b]=t.dataset.set.split('.');
    const sx=SETTINGS.find(x=>x.k===t.dataset.set),nx=acc(t.value);
    if(!confirm('Ubah '+sx.l.toLowerCase()+' menjadi '+(nx?nx.kode+' '+nx.nama:'(kosong)')+'?')){render();return}
    db.setting[a][b]=t.value;persist();render();toast('Pengaturan tersimpan.')}
  if(t.dataset&&t.dataset.bind){const k=t.dataset.bind;ui[k]=k==='histAll'?t.value==='1':t.value;render()}
  if(t.id==='file'&&t.files[0]){doImport(t.files[0]);t.value=''}
});
window.addEventListener('hashchange',route);

/* ============ Mulai ============ */
db=load();
if(!db){resetSample()}else{persist()}
sortCoa();
route();
})();
</script>
</body>
</html>
